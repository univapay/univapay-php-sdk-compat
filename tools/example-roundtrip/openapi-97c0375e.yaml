          application/json:
            schema:
              $ref: "#/components/schemas/EnableTokenThreeDsRequest"
            examples:
              enableThreeDsExample:
                $ref: "#/components/examples/EnableTokenThreeDsRequestExample"
      responses:
        "200":
          description: 3DS enabled successfully. Returns the updated token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionToken"
              examples:
                cardResponse:
                  $ref: "#/components/examples/TokenCardResponseExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
