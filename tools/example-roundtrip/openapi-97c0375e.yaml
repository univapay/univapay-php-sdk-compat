    TransactionTokenCreateRequest:
      type: object
      description: Request payload for creating a transaction token, which represents a payment method to charge against.
      required:
        - payment_type
        - type
        - data
      properties:
        payment_type:
          $ref: "#/components/schemas/TransactionTokenCreateRequestPaymentType"
        type:
          $ref: "#/components/schemas/TransactionTokenCreateRequestType"
        email:
          type: string
          format: email
          example: user@example.com
          description: Customer email address.
        usage_limit:
          type: string
          example: daily
          description: Usage limit applied to the token.
        ip_address:
          type: string
          description: >-
            Consumer's IPv4 address. **Required** when `data.brand` is
            `we_chat_online` and `data.call_method` is `web` or `http_get`.
          example: 198.51.100.14
        metadata:
          $ref: "#/components/schemas/TransactionTokenCreateRequestMetadata"
        data:
          $ref: "#/components/schemas/TransactionTokenCreateRequestData"
    TransactionTokenCreateRequestMetadata:
      type: object
      description: A free-form dictionary for custom metadata.
      properties:
        univapay-reference-id:
          type: string
          description: Any arbitrary value (Free format).
          example: ref-998877
        univapay-customer-id:
          type: string
          format: uuid
          description: Customer ID.
          example: ad0ffeb3-32bc-4b2f-86a6-a79d34c28af5
        univapay-name:
          type: string
          description: Consumer name passed to payment processors that require it (e.g., konbini, bank transfer).
          example: TARO YAMADA
        univapay-phone-number:
          type: string
          description: Consumer phone number passed to payment processors that require it.
          example: "+81 08012341234"
      additionalProperties:
        $ref: "#/components/schemas/TransactionTokenCreateMetadataProps"
      example:
        univapay-reference-id: ref-998877
        univapay-customer-id: 0fd29949-07d5-4a91-8eaf-fbce0897d944

    TransactionTokenCreateMetadataProps:
      oneOf:
        - type: string
          example: sale
          description: String value.
        - type: boolean
          example: true
          description: Boolean value.
        - type: number
          example: 10
          description: Numeric value.
      example: sale

      description: Transaction Token Create Metadata Props schema.
    TransactionTokenBase:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 6426bbd2-17bd-41bf-883b-1fe970db48ee
          description: Unique identifier.
        store_id:
          type: string
          format: uuid
          example: fc264608-9a9e-495e-844e-a08129a81af4
          description: Store identifier.
        email:
          type: string
          format: email
          nullable: true
          example: test@univapay.com
          description: Customer email address.
        active:
          type: boolean
          example: true
          description: Whether the resource is active.
        mode:
          $ref: "#/components/schemas/TransactionTokenMode"
        type:
          $ref: "#/components/schemas/TransactionTokenType"
        usage_limit:
          type: string
          nullable: true
          description: Usage limit applied to the token.
          example: example
        confirmed:
          type: boolean
          nullable: true
          example: true
          description: Whether the token has been confirmed.
        metadata:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TransactionTokenMetadataAdditionalProperties"
          example:
            customer_id: "cust_12345"
          description: Arbitrary key-value metadata.
        created_on:
          type: string
          format: date-time
          example: "2026-04-09T07:35:50Z"
          description: Timestamp when the resource was created.
        updated_on:
          type: string
          format: date-time
          example: "2026-04-09T07:35:50Z"
          description: Timestamp when the resource was last updated.
        last_used_on:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the token was last used.
          example: "2026-04-09T07:35:50.000000Z"

      description: >-
        Fields common to every stored transaction token, regardless of
        payment type. Deliberately excludes `payment_type` and `data` — each
        concrete payment type layers those on top with `data` pinned to its
        own shape; see `TransactionToken` for the discriminated union that
        ties them together.
    CardTransactionToken:
      allOf:
        - $ref: "#/components/schemas/TransactionTokenBase"
        - title: CardTransactionTokenFields
          type: object
          required:
            - payment_type
            - data
          properties:
            payment_type:
              type: string
              const: card
              example: card
              description: Payment method type. Always `card` for this variant.
            data:
              $ref: "#/components/schemas/TokenResponseCardData"
          description: Discriminator and data fields for a card transaction token.
      description: Stored transaction token resource for a `card` payment type.
    KonbiniTransactionToken:
      allOf:
        - $ref: "#/components/schemas/TransactionTokenBase"
        - title: KonbiniTransactionTokenFields
          type: object
          required:
            - payment_type
            - data
          properties:
            payment_type:
              type: string
              const: konbini
              example: konbini
              description: Payment method type. Always `konbini` for this variant.
            data:
              $ref: "#/components/schemas/TokenResponseKonbiniData"
          description: Discriminator and data fields for a konbini transaction token.
      description: Stored transaction token resource for a `konbini` payment type.
    OnlineTransactionToken:
      allOf:
        - $ref: "#/components/schemas/TransactionTokenBase"
        - title: OnlineTransactionTokenFields
          type: object
