          example: 11ef335e-9aa5-c54a-8313-7f9847da313a
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        description: Request payload for suspending a subscription.
        required: false
        content:
          application/json:
            schema:
