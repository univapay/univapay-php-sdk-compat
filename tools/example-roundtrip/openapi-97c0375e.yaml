    BankTransferStatusData:
      type: object
      description: >-
        Data payload for `bank_transfer_status_updated` webhook events.
        Contains the bank transfer extension fields inlined alongside amount and metadata.
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: Bank transfer charge extension ID.
          example: 11ef0000-0000-4000-8000-000000000001
        charge_id:
          type: string
          format: uuid
          description: ID of the associated charge.
          example: 11ef0000-0000-4000-8000-000000000001
        payment_status:
          $ref: "#/components/schemas/BankTransferPaymentStatus"
        latest_deposit_date:
          type: string
          format: date-time
          nullable: true
          description: Date of the most recent deposit.
          example: "2026-04-09T07:35:50.000000Z"
        created_on:
          type: string
          format: date-time
          nullable: true
          description: When the bank transfer extension record was created.
          example: "2026-04-09T07:35:50.000000Z"
        latest_deposit_amount:
          type: integer
          nullable: true
          description: Amount of the most recent deposit in minor currency units.
          example: 1000
        balance:
          type: integer
          nullable: true
          description: Current outstanding balance in minor currency units.
          example: 1000
        currency:
          type: string
          description: ISO 4217 currency code.
          example: JPY
        amount:
          type: integer
          description: Total charge amount in minor currency units.
          example: 1000
        amount_difference:
          type: integer
          nullable: true
          description: Difference between paid and expected amount (positive = over, negative = under).
