        line2:
          type: string
          nullable: true
          description: Secondary street address line.
          example: Shibakoen
        city:
          type: string
          nullable: true
          description: City or locality.
          example: Minato
        state:
          type: string
          nullable: true
          description: State or prefecture.
          example: Tokyo
      example:
        zip: "105-0011"
        line1: "1-1-1"
        city: Minato
        state: Tokyo

      description: Shipping address returned for a Paidy token.
    TokenResponsePaidyData:
      type: object
      required:
        - paidy_token
      properties:
