      tags:
        - Direct Debit
      summary: Get Direct Debit Bank Transfer
      operationId: getDirectDebitBankTransfer
      x-operation-settings: *errorTemplates
      description: >-
        Retrieves a single transfer. Poll this after the cycle's result registration date to pick up the outcome and, on failure, the bank's reason.
      parameters:
        - $ref: "#/components/parameters/MerchantIdPath"
        - $ref: "#/components/parameters/DirectDebitBankTransferIdPath"
      responses:
        "200":
          description: Bank Transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectDebitBankTransfer"
              examples:
                awaitingResponse:
                  $ref: "#/components/examples/DirectDebitBankTransferResponseExample"
                failedResponse:
                  $ref: "#/components/examples/DirectDebitBankTransferFailedResponseExample"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      x-server-name: directDebit
      tags:
        - Direct Debit
      summary: Update Direct Debit Bank Transfer
      operationId: updateDirectDebitBankTransfer
      x-operation-settings: *errorTemplates
      description: >-
        Changes a scheduled transfer's amount. Only permitted while the transfer is `unlocked` — once its cycle's upload deadline passes the amount is fixed.
      parameters:
        - $ref: "#/components/parameters/MerchantIdPath"
        - $ref: "#/components/parameters/DirectDebitBankTransferIdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        description: Request payload for changing the transfer amount.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectDebitBankTransferPatchRequest"
            examples:
              bankTransferPatchExample:
                summary: Change the Amount
                value:
                  amount: 1850
      responses:
        "200":
          description: Bank Transfer Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectDebitBankTransfer"
              examples:
                successResponse:
                  $ref: "#/components/examples/DirectDebitBankTransferResponseExample"
        "400":
          description: Bad Request (400). The transfer is locked, or the amount is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                transferLocked:
                  $ref: "#/components/examples/DirectDebitBankTransferLockedErrorExample"
                invalidAmount:
                  $ref: "#/components/examples/DirectDebitInvalidAmountErrorExample"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      x-server-name: directDebit
      tags:
        - Direct Debit
      summary: Delete Direct Debit Bank Transfer
      operationId: deleteDirectDebitBankTransfer
      x-operation-settings: *errorTemplates
      description: >-
        Cancels a scheduled transfer so it is not sent to the bank. Only permitted while the transfer is `unlocked`.
      parameters:
        - $ref: "#/components/parameters/MerchantIdPath"
        - $ref: "#/components/parameters/DirectDebitBankTransferIdPath"
      responses:
        "204":
          description: Bank Transfer Deleted. Returns no content.
        "400":
          description: Bad Request (400). The transfer is locked and can no longer be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                transferLocked:
