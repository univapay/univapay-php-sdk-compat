          example:
            brand: we_chat_online
            call_method: web
          # Condition 1: WeChat Web or SDK requires user_identifier
        - if:
            properties:
              brand:
                const: we_chat_online
              call_method:
                enum: [web, sdk]
                description: Call method schema used for conditional validation.
            description: If schema used for conditional validation.
            example: {}
          then:
            required:
              - user_identifier
          description: Conditional rule for WeChat online token creation.
          example:
            brand: we_chat_online
            call_method: web
            user_identifier: wechat_open_id_12345
          # Condition 2: D-Barai HTTP Post requires user_identifier
        - if:
            properties:
              brand:
                const: d_barai_online
              call_method:
                const: http_post
            description: If schema used for conditional validation.
            example: {}
          then:
            required:
              - user_identifier
          description: Conditional rule for d-barai online token creation.
          example:
            brand: d_barai_online
            call_method: http_post
            user_identifier: dbarai_user_12345

