    RefundStatus:
      type: string
      enum: [pending, successful, failed, error]
      description: >-
        Current status of the refund.
        `pending`: The refund has been created and is being processed.
        `successful`: The refund was processed successfully.
        `failed`: The refund was rejected by the gateway.
        `error`: An unexpected error occurred during processing.
      example: pending

    RefundReasonRequest:
      type: string
      enum: [duplicate, fraud, customer_request]
      description: >-
        The reason for the refund (merchant-settable values).
        `duplicate`: A duplicate charge was made.
        `fraud`: The charge is fraudulent.
        `customer_request`: The customer requested the refund.
      example: customer_request

    RefundReasonResponse:
      type: string
      enum:
        [
          duplicate,
          fraud,
          customer_request,
          system_failure,
          chargeback,
          chargeback_fee_exempt,
          chargeback_reverse,
        ]
      description: >-
        The reason for the refund as returned by the API. Includes operational
        reasons that merchants cannot set but may still observe on fetched
        refunds.
        `duplicate`: A duplicate charge was made.
        `fraud`: The charge is fraudulent.
        `customer_request`: The customer requested the refund.
        `system_failure`: An internal system failure triggered the refund.
        `chargeback`: A chargeback was raised.
        `chargeback_fee_exempt`: A fee-exempt chargeback.
        `chargeback_reverse`: A chargeback reversal.
      example: customer_request

    Refund:
      type: object
      description: Represents a refund issued against a charge.
