          example: false

    # ==========================================================================
    # CHECKOUT INFO
    # ==========================================================================
    CheckoutMode:
      type: string
      enum: [live, test, live_test]
      example: test
      description: >-
        Store processing mode reflected in the checkout configuration:
        `live` and `test` reflect the credential used to authenticate, while
        `live_test` is reserved for privileged callers testing against
        live-mode data.
    CheckoutRecurringTokenPrivilege:
      type: string
      enum: [none, bounded, infinite]
      example: none
      description: >-
        Level of recurring-charge privilege granted to transaction tokens
        created under this store: `none` disallows recurring use, `bounded`
        allows a limited number of recurring charges, and `infinite` allows
        unlimited recurring charges.
    CheckoutPaymentType:
      type: string
      enum:
        [
          card,
          qr_scan,
          qr_merchant,
          konbini,
          apple_pay,
          paidy,
          online,
          bank_transfer,
        ]
      example: card
      description: Payment type identifier used throughout the checkout configuration.
    CheckoutMoneyAmount:
      type: object
      description: >-
        Monetary amount used by checkout configuration limits and
        thresholds.
      properties:
        amount:
          type: integer
          description: Amount in the smallest unit of the currency.
          example: 1000
        amount_formatted:
          type: number
          description: Amount formatted for display.
          example: 1000
        currency:
          type: string
          description: ISO-4217 currency code.
          example: JPY
    CardLimit:
      type: object
      description: >-
        Per-card spending limit enforced on card payments, evaluated over a
        rolling duration.
      properties:
        amount:
          type: integer
          description: Maximum amount a single card may charge within `duration`.
          example: 100000
        currency:
          type: string
          description: ISO-4217 currency code.
          example: JPY
        amount_formatted:
          type: number
          description: Limit amount formatted for display.
          example: 100000
        duration:
          type: string
          description: ISO-8601 period over which the limit is evaluated (e.g. P1M).
          example: P1M
    CheckoutCardConfiguration:
      type: object
      description: Card payment settings applied to checkout.
      properties:
        enabled:
          type: boolean
          description: Whether card payments are enabled.
          example: true
        debit_enabled:
          type: boolean
          description: Whether debit cards are allowed.
          example: true
        prepaid_enabled:
          type: boolean
          description: Whether prepaid cards are allowed.
          example: true
        debit_authorization_enabled:
          type: boolean
          description: Whether authorization-only flows are allowed for debit cards.
          example: false
        prepaid_authorization_enabled:
          type: boolean
          description: Whether authorization-only flows are allowed for prepaid cards.
          example: false
        only_direct_currency:
          type: boolean
          description: Whether card processing is restricted to direct-settlement currencies.
          example: false
        forbidden_card_brands:
          type: array
          nullable: true
          description: >-
            Card brands rejected by merchant policy. Common values include
            `visa`, `mastercard`, `american_express`, `maestro`,
            `discover`, `jcb`, `diners_club`, `private_label`, and
            `unionpay`; gateway-specific brands the platform cannot map
            appear as `unmapped_<raw value>`. `null` when no brand is
            forbidden.
          items:
            type: string
            description: Card brand identifier.
            example: diners_club
          example:
        allowed_countries_by_ip:
          type: array
          nullable: true
          description: >-
            ISO 3166-1 alpha-2 country codes allowed to originate card
            payments by IP geolocation. `null` when unrestricted.
          items:
            type: string
            description: ISO 3166-1 alpha-2 country code.
            example: JP
          example:
        foreign_cards_allowed:
          type: boolean
          description: Whether cards issued outside the primary operating country are allowed.
          example: true
        fail_on_new_email:
          type: boolean
          nullable: true
          description: >-
            Whether to reject card charges from previously unseen customer
            email addresses. `null` when not configured.
          example:
        card_limit:
          nullable: true
          description: Per-card spending limit. `null` when no limit is configured.
          allOf:
            - $ref: "#/components/schemas/CardLimit"
          example:
        allow_empty_cvv:
          type: boolean
          nullable: true
          description: >-
            Whether card flows may proceed without a CVV. `null` when not
            configured.
          example:
        allow_direct_token_creation:
          type: boolean
          description: >-
            Whether direct card token creation is allowed without a hosted
            capture flow.
          example: true
        three_ds_required:
          type: boolean
          description: Whether 3-D Secure is required for eligible card flows.
          example: false
        three_ds_address_required:
          type: boolean
          description: Whether billing address data is required when running 3-D Secure.
          example: false
        three_ds_skip_enabled:
          type: boolean
          description: Whether privileged callers may request a 3-D Secure skip.
          example: false
        three_ds_phone_number_required:
          type: boolean
          description: Whether a phone number is required when running 3-D Secure.
          example: true
    CheckoutInstallmentsConfiguration:
      type: object
      description: Installment plan configuration applied to checkout.
      properties:
        enabled:
          type: boolean
          description: Whether installment plans are enabled.
          example: true
        card_processor:
          type: object
          title: CheckoutInstallmentCardProcessor
          description: Card-processor capabilities available for installment payments.
          properties:
            revolving:
              type: boolean
              description: Whether revolving installment payments are allowed.
              example: true
            fixed_cycle:
              type: boolean
              description: Whether fixed-cycle installment payments are allowed.
              example: true
        supported_payment_types:
          type: array
          description: Payment types eligible for installment plans.
          items:
            $ref: "#/components/schemas/CheckoutPaymentType"
          example: [card]
        min_charge_amount:
          nullable: true
          description: >-
            Minimum charge amount eligible for installment plans. `null`
            when unrestricted.
          allOf:
            - $ref: "#/components/schemas/CheckoutMoneyAmount"
          example:
        max_payout_period:
          type: string
          nullable: true
          description: >-
            ISO-8601 period bounding the maximum payout delay for
            installment settlements. `null` when unrestricted.
          example:
        only_with_processor:
          type: boolean
          description: >-
            Whether installment plans are restricted to processor-backed
            flows. Always `true` — retained for backwards compatibility.
          example: true
    CheckoutSubscriptionPlanConfiguration:
      type: object
      description: Univapay-side subscription plan configuration applied to checkout.
      properties:
        enabled:
          type: boolean
          description: Whether subscription plans are enabled.
          example: true
        fixed_cycle:
          type: boolean
          description: Whether fixed-cycle subscription plans are allowed.
          example: true
        fixed_cycle_amount:
          type: boolean
          description: Whether fixed-cycle-amount subscription plans are allowed.
          example: true
        supported_payment_types:
          type: array
          description: Payment types eligible for subscription plans.
          items:
            $ref: "#/components/schemas/CheckoutPaymentType"
          example: [card]
        min_charge_amount:
          nullable: true
          description: >-
            Minimum charge amount eligible for subscription plans. `null`
            when unrestricted.
          allOf:
            - $ref: "#/components/schemas/CheckoutMoneyAmount"
          example:
        max_payout_period:
          type: string
          nullable: true
          description: >-
            ISO-8601 period bounding the maximum payout delay for
            subscription settlements. `null` when unrestricted.
          example:
    CheckoutEcConfiguration:
      type: object
      description: EC checkout feature toggles for hosted email receipts and product line items.
      properties:
        ec_email:
          type: object
          title: CheckoutEcEmailConfiguration
          description: Email-related EC checkout settings.
          properties:
            enabled:
              type: boolean
              description: Whether EC email receipts are enabled.
              example: false
        ec_products:
          type: object
          title: CheckoutEcProductsConfiguration
          description: Product-related EC checkout settings.
          properties:
            enabled:
              type: boolean
              description: Whether EC product line items are enabled.
              example: false
    CheckoutQrScanConfiguration:
      type: object
      description: QR-scan (CPM) payment settings applied to checkout.
      properties:
        enabled:
          type: boolean
          description: Whether QR-scan payments are enabled.
          example: true
        forbidden_qr_scan_gateways:
          type: array
          nullable: true
          description: >-
            QR-scan gateways disabled for the merchant. Common values
            include `alipay`, `alipay_plus`, `pay_pay`, `we_chat`,
            `univapay`, and `test`. `null` when no gateway is forbidden.
          items:
            type: string
            description: QR-scan gateway identifier.
            example: we_chat
          example:
    ExpirationTimeShift:
      type: object
      description: >-
        Time-of-day override applied when calculating expirations, shared
        by convenience-store and bank-transfer configuration.
      properties:
        value:
          type: string
          description: >-
            ISO-8601 offset time (HH:mm:ssXXX) that overrides the
            expiration cutoff. Omitted entirely when no override is
            configured.
          example: "23:59:59+09:00"
        enabled:
          type: boolean
          description: Whether the time-of-day override is applied.
          example: false
    CheckoutConvenienceConfiguration:
      type: object
      description: Convenience-store (konbini) payment settings applied to checkout.
      properties:
        enabled:
          type: boolean
          description: Whether convenience-store payments are enabled.
          example: true
        expiration:
          type: string
          description: ISO-8601 duration before a convenience-store payment expires.
          example: PT720H
        expiration_time_shift:
          $ref: "#/components/schemas/ExpirationTimeShift"
    CheckoutThemeColors:
      type: object
      description: >-
        Hex colors applied to the checkout widget. Always resolves to the
        platform defaults shown here when not customized — never `null`.
      properties:
        main_background:
          type: string
          description: Main background color.
          example: "#FFFFFF"
        secondary_background:
          type: string
          description: Secondary background color.
          example: "#F5F8FC"
        main_color:
          type: string
          description: Main accent color.
          example: "#4C5F85"
        main_text:
          type: string
          description: Main text color.
          example: "#FFFFFF"
        primary_text:
          type: string
          description: Primary text color.
          example: "#4C5F85"
        secondary_text:
          type: string
          description: Secondary text color.
          example: "#4C5F85"
        base_text:
          type: string
          description: Base text color.
          example: "#4C5F85"
        body_background:
          type: string
          description: Body background color.
          example: "#FFFFFF"
    CheckoutTheme:
      type: object
      description: Widget theme applied to checkout.
      properties:
        colors:
          $ref: "#/components/schemas/CheckoutThemeColors"
    RecurringCvvConfirmation:
      type: object
      description: >-
        CVV re-confirmation policy applied to recurring card charges
        (subscriptions and tokens with recurring privilege).
      properties:
        enabled:
          type: boolean
          description: >-
            Whether CVV re-confirmation is required for recurring card
            charges. Resolves to `false` when not configured.
          example: false
        threshold:
          type: array
          nullable: true
          description: >-
            Amount thresholds above which CVV re-confirmation is required.
            `null` when no threshold is configured.
          items:
            $ref: "#/components/schemas/CheckoutMoneyAmount"
          example:
    CheckoutBankTransferMatchAmount:
      type: string
      enum: [exact, maximum, minimum, disabled]
      example: disabled
      description: Deposit-matching policy applied to bank transfer payments.
    CheckoutBankTransferConfiguration:
      type: object
      description: Bank transfer (振込) payment settings applied to checkout.
      properties:
        enabled:
          type: boolean
          description: Whether bank transfer payments are enabled.
          example: true
        match_amount:
          $ref: "#/components/schemas/CheckoutBankTransferMatchAmount"
        expiration:
          type: string
          description: ISO-8601 duration before a bank transfer payment expires.
          example: PT72H
        expiration_time_shift:
          $ref: "#/components/schemas/ExpirationTimeShift"
        virtual_bank_accounts_threshold:
          type: integer
          minimum: 0
          description: >-
            Number of unused virtual bank accounts that triggers
            provisioning of additional accounts.
          example: 5
        virtual_bank_accounts_fetch_count:
          type: integer
          minimum: 1
          description: Number of virtual bank accounts provisioned per replenishment.
          example: 10
        default_extension_period:
          type: string
          description: ISO-8601 duration by which a payment deadline is extended by default.
          example: PT168H
        maximum_extension_period:
          type: string
          description: ISO-8601 duration for the maximum allowed extension.
          example: PT168H
        automatic_extension_enabled:
          type: boolean
          description: Whether payment deadlines are extended automatically.
          example: false
        charge_request_notification_enabled:
          type: boolean
          description: Whether a notification is sent when a bank transfer charge is requested.
          example: false
        charge_request_canceled_notification_enabled:
          type: boolean
          description: >-
            Whether a notification is sent when a requested bank transfer
            charge is canceled.
          example: false
        charge_expired_notification_enabled:
          type: boolean
          description: Whether a notification is sent when a bank transfer charge expires.
          example: false
        deposit_received_notification_enabled:
          type: boolean
          description: Whether a notification is sent when a deposit is received.
          example: false
        deposit_insufficient_notification_enabled:
          type: boolean
          description: Whether a notification is sent when a deposit is insufficient.
          example: false
        deposit_exceeded_notification_enabled:
          type: boolean
          description: Whether a notification is sent when a deposit exceeds the requested amount.
          example: false
        extension_notification_enabled:
          type: boolean
          description: Whether a notification is sent when a payment deadline is extended.
          example: false
        remind_notification_period:
          type: string
          description: ISO-8601 duration before expiration at which a reminder notification is sent.
          example: PT168H
        remind_notification_enabled:
          type: boolean
          description: Whether reminder notifications are sent before a payment deadline.
          example: false
    CheckoutSupportedBrand:
      type: object
      description: >-
        Feature support and capability flags for a single payment-type /
        brand combination the store can accept.
      properties:
        payment_type:
          $ref: "#/components/schemas/CheckoutPaymentType"
        brand:
          type: string
          description: >-
            Brand identifier for `payment_type`. For `card` and
            `apple_pay`, one of the common `CardBrand` values (`visa`,
            `mastercard`, `american_express`, `maestro`, `discover`,
            `jcb`, `diners_club`, `private_label`, `unionpay`) or an
            `unmapped_<raw value>` fallback. For `qr_scan`, a QR-CPM brand
            (e.g. `pay_pay`, `we_chat`, `qq`, `line_pay`, `au_pay`,
            `alipay_china`). For `qr_merchant`, a QR-MPM brand (e.g.
            `rakuten_pay_merchant`, `alipay_merchant_qr`,
            `pay_pay_merchant`, `d_barai_mpm`, `we_chat_mpm`). For
            `online`, an online-redirect brand (e.g. `alipay_online`,
            `pay_pay_online`, `we_chat_online`, `d_barai_online`,
            `kakaopay`). For `konbini`, a convenience-store brand (e.g.
            `seven_eleven`, `family_mart`, `lawson`). For `paidy` and
            `bank_transfer`, the payment type's own identifier. The full
            brand catalogue is large and gateway-dependent — treat this as
            an open string, not a fixed set.
          example: visa
        card_brand:
          type: string
          description: >-
            Legacy alias of `brand`. Present only when `payment_type` is
            `card` or `apple_pay`.
          example: visa
        qr_brand:
          type: string
          description: >-
            Legacy alias of `brand`. Present only when `payment_type` is
            `qr_merchant`.
          example: alipay_merchant_qr
        online_brand:
          type: string
          description: >-
            Legacy alias of `brand`. Present only when `payment_type` is
            `online`.
          example: alipay_online
        dynamic_info:
          type: boolean
          description: Whether the brand's supported feature set is resolved dynamically.
          example: false
        support_auth_capture:
          type: boolean
          description: Whether the brand supports separate authorization and capture.
          example: true
        requires_full_name:
          type: boolean
          description: Whether the brand requires the cardholder's full name.
          example: false
        requires_cvv:
          type: boolean
          description: Whether the brand requires a CVV.
          example: true
        countries_allowed:
          type: array
          nullable: true
          description: >-
            ISO 3166-1 alpha-2 country codes allowed for this brand.
            `null` when unrestricted.
          items:
            type: string
            description: ISO 3166-1 alpha-2 country code.
            example: JP
          example:
        supported_currencies:
          type: array
          nullable: true
          description: >-
            ISO-4217 currency codes supported by this brand. `null` when
            unrestricted.
          items:
            type: string
            description: ISO-4217 currency code.
            example: JPY
          example:
        cvv_auth:
          type: boolean
          description: Whether this brand supports CVV-only authorization.
          example: false
        installment_capable:
          type: boolean
          description: Whether this brand supports installment plans.
          example: true
        mcp_capable:
          type: boolean
          description: Whether this brand supports multi-currency pricing.
          example: false
        mcp_only:
          type: boolean
          description: Whether this brand is only available through multi-currency pricing.
          example: false
    CheckoutInfo:
      type: object
      description: >-
        Merchant/store checkout configuration: enabled payment methods and
        their limits, installment/subscription plan settings,
        convenience-store and bank-transfer settings, widget theme, and
        per-brand feature support. Returned in full on every call — there
        is no partial-update or list variant.
      properties:
        mode:
          $ref: "#/components/schemas/CheckoutMode"
        recurring_token_privilege:
          $ref: "#/components/schemas/CheckoutRecurringTokenPrivilege"
        name:
          type: string
          description: Store display name.
          example: Test store
        card_configuration:
          $ref: "#/components/schemas/CheckoutCardConfiguration"
        subscription_configuration:
          type: object
          title: CheckoutSubscriptionConfiguration
          description: Univapay-hosted subscription feature toggle.
          properties:
            enabled:
              type: boolean
              description: Whether Univapay-hosted subscriptions are enabled.
              example: true
        installments_configuration:
          $ref: "#/components/schemas/CheckoutInstallmentsConfiguration"
        subscription_plan_configuration:
          $ref: "#/components/schemas/CheckoutSubscriptionPlanConfiguration"
        checkout_configuration:
          $ref: "#/components/schemas/CheckoutEcConfiguration"
        qr_scan_configuration:
          $ref: "#/components/schemas/CheckoutQrScanConfiguration"
        convenience_configuration:
          $ref: "#/components/schemas/CheckoutConvenienceConfiguration"
        paidy_configuration:
          type: object
          title: CheckoutPaidyConfiguration
          description: Paidy payment feature toggle.
          properties:
            enabled:
              type: boolean
              description: Whether Paidy payments are enabled.
              example: true
        paidy_public_key:
          type: string
          nullable: true
          description: >-
            Public key used to initialize the Paidy widget. `null` when
            Paidy is not configured for this store.
          example:
        logo_image:
          type: string
          format: uri
          nullable: true
          description: >-
            URL of the store's checkout logo image. `null` when no logo
            is configured. Note: this response field is `logo_image`, but
            the corresponding store-configuration update field is
            `logo_url` — the two names do not round-trip automatically.
          example:
        theme:
          $ref: "#/components/schemas/CheckoutTheme"
        recurring_card_charge_cvv_confirmation:
          $ref: "#/components/schemas/RecurringCvvConfirmation"
        online_configuration:
          type: object
          title: CheckoutOnlineConfiguration
          description: Online redirect/wallet payment feature toggle.
          properties:
            enabled:
              type: boolean
              description: Whether online redirect/wallet payments are enabled.
              example: true
        bank_transfer_configuration:
          $ref: "#/components/schemas/CheckoutBankTransferConfiguration"
        supported_brands:
          type: array
          description: >-
            Feature support and capability flags for every payment-type /
            brand combination the store can accept.
          items:
            $ref: "#/components/schemas/CheckoutSupportedBrand"
          example:
            - payment_type: card
              brand: visa
              card_brand: visa
              dynamic_info: false
              support_auth_capture: true
              requires_full_name: false
              requires_cvv: true
              countries_allowed:
              supported_currencies:
              cvv_auth: false
              installment_capable: true
              mcp_capable: false
              mcp_only: false
            - payment_type: qr_merchant
              brand: alipay_merchant_qr
              qr_brand: alipay_merchant_qr
              dynamic_info: false
              support_auth_capture: false
              requires_full_name: false
              requires_cvv: false
              countries_allowed:
              supported_currencies:
              cvv_auth: false
              installment_capable: false
              mcp_capable: false
              mcp_only: false

    # ==========================================================================
    # TRANSACTION HISTORY
    # ==========================================================================
    TransactionHistoryType:
      type: string
      enum: [charge, refund]
      example: charge
      description: Whether this row represents a charge or a refund.
    TransactionHistoryStatus:
      type: string
      enum: [pending, authorized, successful, failed, error, canceled, awaiting]
      example: successful
      description: >-
        Status of the underlying resource. Charge rows use the full set of
        values; refund rows only ever report `pending`, `successful`,
        `failed`, or `error`.
    TransactionHistoryMode:
      type: string
      enum: [live, test, live_test]
      example: test
      description: >-
        Environment mode: `live` and `test` reflect the credential used to
        authenticate, while `live_test` is reserved for privileged callers
        testing against live-mode data.
    TransactionHistoryPaymentType:
      type: string
      enum:
        [
          card,
          qr_scan,
          qr_merchant,
          konbini,
          apple_pay,
          paidy,
          online,
          bank_transfer,
        ]
      example: card
      description: The payment method used for the underlying charge.
    TransactionHistoryChargeType:
      type: string
      enum: [normal, cvv_auth]
      example: normal
      description: Whether the underlying charge was a normal charge or a CVV authorization.
    TransactionHistoryServiceProvider:
      type: string
      enum:
        - credit
        - convenience
        - bank_transfer
        - paidy
        - pay_pay
        - alipay
        - we_chat
        - docomo
        - mercari
        - au
        - rakuten
        - bartong
        - jkopay
        - ginko_pay
        - aeon_pay
        - eromnet
        - test
      example: credit
      description: The processor or service provider that handled the payment.
    TransactionHistoryRefundReason:
      type: string
      enum:
        - duplicate
        - fraud
        - customer_request
        - system_failure
        - chargeback
        - chargeback_fee_exempt
        - chargeback_reverse
      example: customer_request
      description: Reason code for a refund.
    TransactionHistoryRefundStatus:
      type: string
      enum: [pending, successful, failed, error]
      example: successful
      description: Status of a single refund entry.
    NullableTransactionHistoryChargeType:
      description: Charge type, or `null` when not applicable.
      oneOf:
        - $ref: "#/components/schemas/TransactionHistoryChargeType"
        - type: "null"
          description: Null value.
          example:
      example: normal
    NullableTransactionHistoryServiceProvider:
      description: Service provider, or `null` when not reported.
      oneOf:
        - $ref: "#/components/schemas/TransactionHistoryServiceProvider"
        - type: "null"
          description: Null value.
          example:
      example: credit
    NullableTransactionHistoryRefundReason:
      description: Refund reason, or `null` when unset.
      oneOf:
        - $ref: "#/components/schemas/TransactionHistoryRefundReason"
        - type: "null"
          description: Null value.
          example:
      example: customer_request
    NullableBankTransferPaymentStatus:
      description: Bank transfer payment status, or `null` when not applicable.
      oneOf:
        - $ref: "#/components/schemas/BankTransferPaymentStatus"
        - type: "null"
          description: Null value.
          example:
      example: exact
    TransactionHistoryRefund:
      type: object
      description: A single refund issued against the charge this row describes.
      properties:
        refund_id:
          type: string
          format: uuid
          description: Unique identifier of the refund.
          example: 11ef0000-0000-4000-8000-000000000010
        amount:
          type: integer
          description: Refunded amount, in the currency's minor unit.
          example: 500
        currency:
          type: string
          description: ISO-4217 currency code.
          example: JPY
        amount_formatted:
          type: number
          description: Refunded amount, formatted per the currency's display scale.
          example: 500
        status:
          $ref: "#/components/schemas/TransactionHistoryRefundStatus"
        reason:
          $ref: "#/components/schemas/TransactionHistoryRefundReason"
    TransactionHistoryUserData:
      type: object
      description: >-
        Payment-type-specific details for this row. This is a single flat
        object covering every payment type — the fields actually populated
        depend on `payment_type` (documented per field below). Fields not
        applicable to a given payment type are omitted.
      properties:
        type:
          $ref: "#/components/schemas/TransactionHistoryType"
        cardholder_name:
          type: string
          description: Cardholder name. Present for `card` and `apple_pay` rows only.
          example: Some Guy
        cardholder_email_address:
          type: string
          nullable: true
          description: >-
            Cardholder/customer email address. Present for every payment
            type except `konbini`'s legacy alias fields; always non-null
            for `bank_transfer` rows, nullable for every other type.
          example: test4@univapay.com
        cardholder_phone_number:
          type: string
          nullable: true
          description: Cardholder phone number. Present for `paidy` rows only.
          example: "08012345678"
        customer_name:
          type: string
          description: >-
            Customer name as entered at checkout. Present for `konbini`
            rows only (empty string when not provided).
          example: Taro Yamada
        convenience_store:
          type: string
          description: >-
            Legacy duplicate of `brand`. Present for `konbini` rows only.
          example: seven_eleven
        brand:
          type: string
          nullable: true
          description: >-
            Raw brand identifier for the payment method. Present for every
            payment type; the value set is payment-type-specific (e.g. card
            brands for `card`/`apple_pay`, QR brands for `qr_scan`/`qr_merchant`,
            online-wallet brands for `online`, convenience-store brands for
            `konbini`, `paidy` for `paidy` rows). Nullable for `qr_scan`,
            `qr_merchant`, and `online`; always non-null for the other types.
          example: visa
        gateway:
          type: string
          nullable: true
          description: Raw gateway identifier that processed the payment. Present for every payment type.
          example: test
        service_provider:
          $ref: "#/components/schemas/NullableTransactionHistoryServiceProvider"
        refunds:
          type: array
          description: >-
            Refunds issued against this charge. Present for charge rows
            only (`type: charge`); absent for refund rows.
          items:
            $ref: "#/components/schemas/TransactionHistoryRefund"
        reason:
          $ref: "#/components/schemas/NullableTransactionHistoryRefundReason"
      example:
        type: charge
        cardholder_name: Some Guy
        cardholder_email_address: test4@univapay.com
        brand: visa
        gateway: test
        service_provider: credit
        refunds:
          - refund_id: 11ef0000-0000-4000-8000-000000000010
            amount: 500
            currency: JPY
            amount_formatted: 500
            status: successful
    TransactionHistoryItem:
      type: object
      description: A single charge or refund row in the merchant's transaction history.
      properties:
        store_id:
          type: string
          format: uuid
          description: Store identifier.
          example: 11edf541-c42d-653c-8c3d-dfe0a55f95c0
        resource_id:
          type: string
          format: uuid
          description: ID of the underlying resource — a charge ID for charge rows, a refund ID for refund rows.
          example: 11ef0000-0000-4000-8000-000000000070
        charge_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the originating charge. `null` for charge rows; set for refund rows.
          example:
        amount:
          type: integer
          description: Amount, in the currency's minor unit.
          example: 1000
        currency:
          type: string
          description: ISO-4217 currency code.
          example: JPY
        amount_formatted:
          type: number
          description: Amount, formatted per the currency's display scale.
          example: 1000
        type:
          $ref: "#/components/schemas/TransactionHistoryType"
        status:
          $ref: "#/components/schemas/TransactionHistoryStatus"
        metadata:
          $ref: "#/components/schemas/GenericMetadata"
        created_on:
          type: string
          format: date-time
          description: Timestamp when the underlying resource was created.
          example: "2024-05-01T12:34:56.789Z"
        mode:
          $ref: "#/components/schemas/TransactionHistoryMode"
        merchant_name:
          type: string
          description: Merchant display name.
          example: Test merchant
        store_name:
          type: string
          description: Store display name.
          example: Test store
        payment_type:
          $ref: "#/components/schemas/TransactionHistoryPaymentType"
        user_data:
          $ref: "#/components/schemas/TransactionHistoryUserData"
        bank_transfer_payment_status:
          $ref: "#/components/schemas/NullableBankTransferPaymentStatus"
        bank_transfer_latest_deposit_date:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recent deposit matched against a bank transfer charge. `null` when not applicable.
          example:
        mcp_token_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the multi-currency-pricing token used, when applicable. `null` when not applicable.
          example:
        charge_type:
          $ref: "#/components/schemas/NullableTransactionHistoryChargeType"
    TransactionHistoryList:
      type: object
      description: >-
        Paginated list of transaction history rows. Unlike other list
        responses in this API, `total_hits` is only present on the first
        page (no `cursor` supplied) or the last page, and `next_cursor` is
        only present while `has_more` is `true`.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TransactionHistoryItem"
          description: List of resources.
          example:
            - store_id: 11edf541-c42d-653c-8c3d-dfe0a55f95c0
              resource_id: 11ef0000-0000-4000-8000-000000000070
              charge_id:
              amount: 1000
              currency: JPY
              amount_formatted: 1000
              type: charge
              status: successful
              metadata: {}
              created_on: "2024-05-01T12:34:56.789Z"
              mode: test
              merchant_name: Test merchant
              store_name: Test store
              payment_type: card
              user_data:
                type: charge
                cardholder_name: Some Guy
                cardholder_email_address: test4@univapay.com
                brand: visa
                gateway: test
                service_provider: credit
                refunds:
                  - refund_id: 11ef0000-0000-4000-8000-000000000010
                    amount: 500
                    currency: JPY
                    amount_formatted: 500
                    status: successful
              bank_transfer_payment_status:
              bank_transfer_latest_deposit_date:
              mcp_token_id:
              charge_type: normal
            - store_id: 11edf541-c42d-653c-8c3d-dfe0a55f95c0
              resource_id: 11ef0000-0000-4000-8000-000000000010
              charge_id: 11ef0000-0000-4000-8000-000000000070
              amount: 500
              currency: JPY
              amount_formatted: 500
              type: refund
              status: successful
              metadata: {}
              created_on: "2024-05-01T13:00:00.000000Z"
              mode: test
              merchant_name: Test merchant
              store_name: Test store
              payment_type: card
              user_data:
                type: refund
                reason: customer_request
              bank_transfer_payment_status:
              bank_transfer_latest_deposit_date:
              mcp_token_id:
              charge_type:
        has_more:
          type: boolean
          example: false
          description: Whether more results are available.
        total_hits:
          type: integer
          example: 2
          description: >-
            Total number of matching resources. Present on the first page
            (no `cursor` supplied) or the last page; absent on intermediate
            pages while `has_more` is `true`.
        next_cursor:
          type: string
          format: uuid
          description: Cursor to pass as `cursor` to fetch the next page. Present only while `has_more` is `true`.
          example: 11ef0000-0000-4000-8000-000000000071

  examples:
    EnableTokenThreeDsRequestExample:
