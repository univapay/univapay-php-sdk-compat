        [daily, weekly, biweekly, monthly, quarterly, semiannually, annually]
      example: monthly

      description: Subscription Period schema.
    SubscriptionTerminationMode:
      type: string
      enum: [immediate, on_next_payment]
      default: immediate
      example: immediate

      description: Subscription Termination Mode schema.
    SubscriptionStatus:
      type: string
      enum:
        [
          unverified,
          unconfirmed,
          canceled,
          unpaid,
          current,
          suspended,
          completed,
        ]
      example: current

      description: Subscription Status schema.
    SubscriptionSimulationPeriod:
      type: string
      enum:
        [
          daily,
          weekly,
          biweekly,
          monthly,
          bimonthly,
          quarterly,
          semiannually,
          annually,
        ]
      example: monthly
      description: >-
        Billing frequency for the simulated schedule. Includes `bimonthly`,
        which is not offered on `SubscriptionPeriod` for live subscription
        creation.
    SubscriptionSimulationPlanSettings:
      type: object
      description: >-
        Cycle-limiting plan configuration used to simulate an installment
        plan or a Univapay-side subscription plan.
      properties:
        plan_type:
          type: string
          title: SimulationPlanSettingsType
          enum: [revolving, fixed_cycles, fixed_cycle_amount]
          example: fixed_cycles
          description: Plan type selector.
        fixed_cycles:
          type: integer
          description: Number of cycles for the fixed_cycles plan. Must be greater than 1.
          example: 10
        fixed_cycle_amount:
          type: integer
          description: >-
            Total target amount for the fixed_cycle_amount plan. Must not
            exceed the requested amount.
          example: 1000
      example: {}
    SubscriptionSimulationRequest:
      type: object
      required:
        - amount
        - currency
        - payment_type
        - schedule_settings
      properties:
        amount:
          type: integer
          minimum: 1
          description: Amount to be charged in each cycle. Must be a positive integer.
          example: 1000
        currency:
          type: string
          description: ISO-4217 currency code.
          example: JPY
        payment_type:
          $ref: "#/components/schemas/TransactionTokenPaymentType"
        initial_amount:
          type: integer
          minimum: 0
          description: Optional different amount for the first charge. Must be zero or greater.
          example: 1000
        period:
          $ref: "#/components/schemas/SubscriptionSimulationPeriod"
        cyclical_period:
          type: string
          description: >-
            ISO-8601 Duration for custom frequency (e.g., P3D, P2M). Cannot
            be used together with 'period' — specify exactly one of the two.
          example: P1M
        schedule_settings:
          $ref: "#/components/schemas/SubscriptionScheduleSettings"
        installment_plan:
          $ref: "#/components/schemas/SubscriptionSimulationPlanSettings"
        subscription_plan:
          $ref: "#/components/schemas/SubscriptionSimulationPlanSettings"
        only_direct_currency:
          type: boolean
          example: false
          description: Whether only direct currency processing is allowed.
      description: >-
        Request payload for simulating a subscription payment schedule
        without creating a live subscription. Specify exactly one of
        'period' or 'cyclical_period' to define the billing frequency.
        'installment_plan' and 'subscription_plan' are mutually exclusive —
        specify at most one to model a limited-cycle schedule.
      example:
        amount: 1000
        currency: JPY
        payment_type: card
        period: monthly
        schedule_settings:
          zone_id: Asia/Tokyo
    SubscriptionSimulationPayment:
      type: object
      properties:
        due_date:
          type: string
          format: date
          description: Scheduled due date for this simulated payment (YYYY-MM-DD).
          example: "2026-09-01"
        zone_id:
          type: string
          description: IANA timezone identifier used to resolve the due date.
          example: Asia/Tokyo
        amount:
          type: integer
          minimum: 0
          description: >-
            Amount to be charged on this cycle, in the smallest currency
            unit.
          example: 1000
        currency:
          type: string
          description: ISO-4217 currency code.
          example: JPY
        is_paid:
          type: boolean
          description: >-
            Always `false` for simulated payments — no real payment has been
            made.
          example: false
        is_last_payment:
          type: boolean
          description: Whether this is the final payment in the simulated schedule.
          example: false
        successful_payment_date:
          type: string
          format: date
          nullable: true
          description: >-
            Always `null` for simulated payments — populated only once a
            real payment settles.
          example:
        terminate_with_status:
          type: string
          enum: [suspended, canceled]
          nullable: true
          description: >-
            The status the subscription would transition to on this
            payment's due date, if a termination is scheduled. `null` when
            no termination applies.
          example:
        retry_interval:
          type: string
          nullable: true
          description: >-
            ISO-8601 Duration for the retry interval applied if this payment
            fails (e.g., P5D). `null` if no retry interval is configured.
          example:
      description: A single scheduled payment produced by the subscription plan simulation.
      example: {}
    SubscriptionPatchPaymentRequest:
      type: object
      description: >-
        Request body for updating a scheduled payment. All fields are optional.
        Omitted fields are left unchanged.
      properties:
        due_date:
          type: string
          format: date
          description: >-
            New due date for this payment (YYYY-MM-DD).  Only available to merchants with permission to edit payment dates.
          example: "2026-09-01"
        is_paid:
          type: boolean
          description: >-
            Mark this payment as paid. Setting to `true` will trigger scheduling  of the next payment in the cycle.
          example: true
        terminate_with_status:
          $ref: "#/components/schemas/NullableSubscriptionTerminateWithStatus"
        retry_interval:
          $ref: "#/components/schemas/NullableIso8601Duration"
      example:
        due_date: "2026-09-01"
        is_paid: false
        terminate_with_status:
        retry_interval: P3D

    SubscriptionSuspendRequest:
      type: object
      description: >-
