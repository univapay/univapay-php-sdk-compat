    Subscription:
      type: object
      description: The Subscription object represents a recurring payment schedule.
      properties:
        id:
          type: string
          format: uuid
          example: 11ef335e-9aa5-c54a-8313-7f9847da313a
          description: Unique identifier.
        store_id:
          type: string
          format: uuid
          example: 11edf541-c42d-653c-8c3d-dfe0a55f95c0
          description: Store identifier.
        transaction_token_id:
          type: string
          format: uuid
          example: 11ef32a7-3a71-8662-803f-1bc27702eeec
          description: Transaction token identifier.
        amount:
          type: integer
          example: 1250
          description: Amount in the smallest currency unit.
        currency:
          type: string
          example: USD
          description: ISO-4217 currency code.
        amount_formatted:
          type: number
          example: 12.5
          description: Amount formatted for display.
        initial_amount:
          type: integer
          nullable: true
          example:
          description: Initial amount in the smallest currency unit.
        initial_amount_formatted:
          type: number
          nullable: true
          example:
          description: Initial amount formatted for display.
        subsequent_cycles_start:
          type: string
          format: date-time
          nullable: true
          example:
          description: Timestamp when recurring cycles begin.
        schedule_settings:
          $ref: "#/components/schemas/SubscriptionScheduleSettings"
        only_direct_currency:
          type: boolean
          example: false
          description: Whether only direct currency processing is allowed.
        first_charge_capture_after:
          type: string
          nullable: true
          description: ISO-8601 Duration (e.g., P3D).
          example:
        first_charge_authorization_only:
          type: boolean
          example: false
          description: Whether the first charge is authorization-only.
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        metadata:
          $ref: "#/components/schemas/GenericMetadata"
        mode:
          $ref: "#/components/schemas/ChargeMode"
        created_on:
          type: string
          format: date-time
          example: "2024-06-26T01:51:28.627023Z"
          description: Timestamp when the resource was created.
        three_ds:
          $ref: "#/components/schemas/SubscriptionThreeDs"
        period:
          $ref: "#/components/schemas/SubscriptionPeriod"
        cyclical_period:
          type: string
          nullable: true
          example:
          description: >-
            ISO-8601 Duration for a custom billing frequency (e.g., P3D,
            P1M), returned instead of `period` when the subscription uses a
            custom cycle length rather than one of the fixed period presets.
            Mutually exclusive with `period` — exactly one of the two is
            present.
        next_payment:
          $ref: "#/components/schemas/SubscriptionNextPayment"
        cycles_left:
          type: integer
          minimum: 0
          nullable: true
          example:
          description: >-
            Number of remaining billing cycles before the subscription
            completes. Only present for cycle-limited plans
            (`subscription_plan` or `installment_plan`); `null` for
            indefinite subscriptions.
        subscription_plan:
          $ref: "#/components/schemas/SubscriptionPlanSettings"
        installment_plan:
          $ref: "#/components/schemas/SubscriptionInstallmentPlanResponse"
        charge_id:
          type: string
          format: uuid
          nullable: true
          example:
          description: >-
            Identifier of the charge associated with the subscription's
            installment plan. Only present when `installment_plan` is set.
        amount_left:
          type: integer
          minimum: 0
          nullable: true
          example:
          description: >-
            Remaining amount to be charged over the life of the plan, in the
            smallest currency unit. Only present for cycle-limited plans.
        amount_left_formatted:
          type: number
          nullable: true
          example:
          description: "`amount_left` formatted for display."

    SubscriptionCreateRequest:
      type: object
      required:
        - transaction_token_id
        - amount
        - currency
      properties:
        transaction_token_id:
          type: string
          format: uuid
          description: Transaction token ID authorized for recurring payments.
          example: 11ef32a7-3a71-8662-803f-1bc27702eeec
        amount:
          type: integer
          description: Amount to be charged in each cycle.
          example: 1250
        currency:
          type: string
          description: ISO-4217 currency code.
          example: USD
        initial_amount:
          type: integer
          description: Optional different amount for the first charge.
          example: 1000
        period:
          $ref: "#/components/schemas/SubscriptionPeriod"
        cyclical_period:
          type: string
          description: >-
            ISO-8601 Duration for custom frequency (e.g., P3D, P2M).  Cannot be used if 'period' is specified.
          example: P1M
        schedule_settings:
          $ref: "#/components/schemas/SubscriptionScheduleSettings"
        installment_plan:
          $ref: "#/components/schemas/SubscriptionInstallmentPlan"
        subscription_plan:
          $ref: "#/components/schemas/SubscriptionPlanSettings"
        first_charge_authorization_only:
          type: boolean
          default: false
          description: If true, the first charge will only be an authorization (Hold).
        first_charge_capture_after:
          type: string
          description: >-
            ISO-8601 Duration for auto-capture if authorization only is true.  Allowed days: P1D to P6D.
          example: P3D
        metadata:
          $ref: "#/components/schemas/GenericMetadata"
        three_ds:
          $ref: "#/components/schemas/ChargeCreateRequestThreeDs"

      description: Request payload for creating a subscription.
      example:
        transaction_token_id: 11ef32a7-3a71-8662-803f-1bc27702eeec
        amount: 1250
        currency: USD
        period: monthly
    SubscriptionScheduleSettings:
      type: object
      properties:
        start_on:
          type: string
          format: date
          description: Date when the recurring schedule starts (YYYY-MM-DD).
          example: "2024-07-26"
        zone_id:
          type: string
          description: IANA Timezone ID.
          example: Asia/Tokyo
        preserve_end_of_month:
          type: boolean
          description: If true, subsequent charges will always occur on the last day of the month.
          example: true
        retry_interval:
          type: string
          description: ISO-8601 Duration for retry interval if payment fails (e.g., P5D).
          example: P5D
        termination_mode:
          $ref: "#/components/schemas/SubscriptionTerminationMode"

      description: Schedule settings applied to a subscription.
      example: {}
    SubscriptionUpdateRequest:
      type: object
      properties:
        transaction_token_id:
          type: string
          format: uuid
          description: >-
            Transaction token ID used for the subscription.  Can be changed to update the payment method (e.g., when a card expires).  Allowed only when the status is `unconfirmed`, `unpaid`, `current`, or `suspended`.
          example: 11ef3362-3700-c54a-9baa-6f7e6527c9d9
        amount:
          type: integer
          description: >-
            The recurring charge amount (applied to the cycle after the next one).  Not available for limited-cycle subscriptions.  To change the immediate next payment amount, update `next_payment.amount` instead.
          example: 1250
        period:
          $ref: "#/components/schemas/SubscriptionPeriod"
        cyclical_period:
          type: string
          description: >-
            ISO-8601 Duration for custom frequency (e.g., P3D, P2M). Cannot be
            used together with `period`. Only allowed before the
            subscription's first payment has been paid.
          example: P1M
        initial_amount:
          type: integer
          description: >-
            Different amount for the first charge. Only allowed while the
            subscription status is still editable (before it has started)
            and requires the App Token Secret.
          example: 1000
        subscription_plan:
          $ref: "#/components/schemas/SubscriptionPlanSettings"
        installment_plan:
          $ref: "#/components/schemas/SubscriptionInstallmentPlan"
        metadata:
          $ref: "#/components/schemas/GenericMetadata"
        status:
          $ref: "#/components/schemas/SubscriptionUpdateStatus"
        schedule_settings:
          $ref: "#/components/schemas/SubscriptionUpdateScheduleSettings"
        next_payment:
          $ref: "#/components/schemas/SubscriptionUpdateNextPayment"
      example:
        metadata:
          order_id: "12345"
        transaction_token_id: 11ef3362-3700-c54a-9baa-6f7e6527c9d9
        schedule_settings:
          termination_mode: on_next_payment
        next_payment:
          due_date: "2030-01-01"

      description: Request payload for updating a subscription.
    SubscriptionUpdateStatus:
      type: string
      enum: [suspended, unpaid]
      description: >-
        Update the subscription status.  `suspended`: Pause the subscription.  `unpaid`: Resume a suspended subscription.
      example: suspended

    SubscriptionUpdateScheduleSettings:
      type: object
      properties:
        termination_mode:
          $ref: "#/components/schemas/SubscriptionTerminationMode"
        start_on:
          type: string
          format: date
          description: >-
            Subscription start date (YYYY-MM-DD). Used to change the first
            actual charge date for subscriptions that initially only
            registered a payment method. Must be in the future; only
            available before the subscription has more than one paid
            payment.
          example: "2026-05-22"
        preserve_end_of_month:
          type: boolean
          description: If true, subsequent charges will always occur on the last day of the month.
          example: true
        retry_interval:
          type: string
          description: >-
            ISO-8601 Duration for retry interval if payment fails  (e.g., P3D for 3 days, PT48H for 48 hours).
          example: P3D

      description: Schedule settings that can be updated on a subscription.
      example: {}
    SubscriptionUpdateNextPayment:
      type: object
      properties:
        due_date:
          type: string
          format: date
          description: >-
            Next payment date (YYYY-MM-DD).  Note: Only available for merchants permitted to edit next payment dates.
          example: "2030-01-01"
        amount:
          type: integer
          description: >-
            Next payment amount. Not available for limited-cycle subscriptions.  Only available for permitted merchants.  This does not change subsequent cycle amounts.
          example: 1000
        terminate_with_status:
          $ref: "#/components/schemas/NullableSubscriptionTerminateWithStatus"

      description: Fields that can be updated on the next scheduled payment.
      example: {}
    SubscriptionTerminateWithStatus:
      type: string
      enum: [suspended, canceled]
      description: The status to transition the subscription to on the next payment date.
      example: suspended
    NullableSubscriptionTerminateWithStatus:
      description: >-
        Schedule a status transition on a payment's due date.
        Set to `suspended` or `canceled` to schedule termination.
        Send `null` to cancel a previously scheduled transition.
      oneOf:
        - $ref: "#/components/schemas/SubscriptionTerminateWithStatus"
        - type: "null"
          description: Null value.
          example:
      example: null

    SubscriptionNextPayment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
