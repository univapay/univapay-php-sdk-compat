      description: Retrieves the details of an existing transaction token.
      operationId: getTransactionToken
      x-operation-settings: *errorTemplates
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdPath"
        - name: polling
          in: query
          schema:
            description: Whether to hold the request open until the status settles.
            type: boolean
          description: >-
            If set to true, instructs the API to internally poll the token's
            3DS or CVV authorization sub-status until it transitions to
            another status, or until the ~3 second server-side timeout is
            reached.
          example: true
      responses:
        "200":
          description: Token Details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionToken"
              examples:
                cardResponse:
                  $ref: "#/components/examples/TokenCardResponseExample"
                konbiniResponse:
                  $ref: "#/components/examples/TokenKonbiniResponseExample"
                onlineResponse:
                  $ref: "#/components/examples/TokenOnlineResponseExample"
                onlineAlipayResponse:
                  $ref: "#/components/examples/TokenOnlineAlipayResponseExample"
                onlineAlipayHttpGetResponse:
                  $ref: "#/components/examples/TokenOnlineHttpGetResponseExample"
                bankTransferResponse:
                  $ref: "#/components/examples/TokenBankTransferResponseExample"
                qrScanResponse:
                  $ref: "#/components/examples/TokenQrScanResponseExample"
                qrMerchantResponse:
                  $ref: "#/components/examples/TokenQrMerchantResponseExample"
                paidyResponse:
                  $ref: "#/components/examples/TokenPaidyResponseExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    patch:
      tags:
        - Transaction Tokens
        - PCI DSS Required
      summary: Update Transaction Token (Legacy)
      operationId: updateTransactionToken
      x-operation-settings: *errorTemplates
      description: >-
        ⚠️ **LEGACY WARNING: Discouraged Operation**

        While it is technically possible to update a transaction token, this
        practice is highly discouraged and is maintained solely for legacy
        reasons. 

        **Updating raw card details requires your server environment to be fully
        PCI DSS compliant.**

        **Recommended Approach:** Instead of updating an existing token, it is
        best practice to create an entirely new transaction token using
        Univapay's frontend integrations (**Link Form**, **Widget**, or **Inline
        Form**). This allows Univapay to securely handle the customer's payment
        data without it ever touching your servers.

        --- **Legacy Usage:** Updates CVV, Address, Email, or Card
        Details.  *Note: If updating only the CVV to resolve a
        `RECURRING_USAGE_REQUIRES_CVV` error, the application token secret is
        not required.*
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        description: Request payload for updating a transaction token.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionTokenUpdateRequest"
            examples:
              updateCardExample:
                summary: Update Card Details
                value:
                  email: "test.update@test.com"
                  data:
                    cardholder: "TARO YAMADA"
                    card_number: "4000020000000000"
                    exp_month: 12
                    exp_year: 2099
                    cvv: "123"
                    line1: "11111"
                    line2: "222"
                    state: "Tokyo"
                    city: "テスト区一丁目"
                    country: "JP"
                    zip: "1234567"
                    phone_number:
                      country_code: "81"
                      local_number: "08000000000"
      responses:
        "200":
          description: Token Updated Successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionToken"
              examples:
                cardResponse:
                  $ref: "#/components/examples/TokenCardResponseExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      tags:
        - Transaction Tokens
      summary: Delete Transaction Token
      operationId: deleteTransactionToken
      x-operation-settings: *errorTemplates
      description: >-
        Deletes a specific transaction token. 

        ⚠️ **WARNING: Breaks Linked Subscriptions**

        Please note that deleting a transaction token will immediately prevent
        any linked recurring charges or subscriptions from being processed.
        Proceed with caution.
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdPath"
      responses:
