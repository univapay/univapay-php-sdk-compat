          requested_amount: 1250
          requested_currency: USD
          requested_amount_formatted: 12.50
          charged_amount: 1250
          charged_currency: USD
          charged_amount_formatted: 12.50
          only_direct_currency: false
          status: successful
          error:
          mode: test
          created_on: "2024-06-26T01:51:30.000000Z"
        created_on: "2026-04-09T07:35:50.000000Z"
    TokenWebhookEvent:
      description: >-
        Webhook envelope for transaction token lifecycle events. Fired as
        `token_created` when a token is created, `token_updated` on metadata
        changes, `token_three_d_s_updated` on 3-D Secure data changes,
        `token_cvv_auth_updated` on CVV authorization changes,
        `token_cvv_auth_check_updated` on CVV auth check changes,
        `token_replaced` when a token is replaced by a new one (e.g., after a
        card update), and `recurring_token_deleted` when a recurring token is
        deleted. The `data` field contains the full TransactionToken object at
        the time of the event.
      type: object
      required:
        - id
        - event
        - created_on
      properties:
        id:
          type: string
          format: uuid
          description: Unique ID of this webhook delivery.
          example: "11ef0000-0000-4000-8000-000000000001"
        event:
          type: string
          title: TokenEvent
          enum:
            - token_created
            - token_updated
            - token_three_d_s_updated
            - token_cvv_auth_updated
            - token_cvv_auth_check_updated
            - token_replaced
            - recurring_token_deleted
          example: token_created
          description: >-
            Event type discriminator — `token_created`, `token_updated`,
            `token_three_d_s_updated`, `token_cvv_auth_updated`,
            `token_cvv_auth_check_updated`, `token_replaced`, or
            `recurring_token_deleted`.
        data:
          $ref: "#/components/schemas/TransactionToken"
        created_on:
          type: string
          format: date-time
          description: Timestamp when the event was fired.
          example: "2026-04-09T07:35:50.000000Z"
      example:
        id: "11ef0000-0000-4000-8000-000000000001"
        event: token_created
        data:
          id: "6426bbd2-17bd-41bf-883b-1fe970db48ee"
          store_id: "fc264608-9a9e-495e-844e-a08129a81af4"
          email: test@univapay.com
          payment_type: card
          active: true
          mode: live
          type: recurring
          confirmed: true
          metadata:
            customer_id: cust_12345
          created_on: "2026-04-09T07:35:50.000000Z"
          updated_on: "2026-04-09T07:35:50.000000Z"
          data:
            card:
              cardholder: TARO YAMADA
              exp_month: 12
              exp_year: 2026
              brand: visa
              last_four: "4242"
        created_on: "2026-04-09T07:35:50.000000Z"
    SubscriptionWebhookEvent:
      description: >-
        Webhook envelope for subscription lifecycle events. Fired as
        `subscription_created` when a subscription is created and its first
        payment initiated, `subscription_payment` when a scheduled payment
        processes successfully, `subscription_completed` when all scheduled
        payments complete, `subscription_failure` when a scheduled payment
        fails, `subscription_canceled` when a subscription is cancelled
        before all payments complete, and `subscription_suspended` when a
        subscription is paused. The `data` field contains the full
        Subscription object at the time of the event.
      type: object
      required:
        - id
        - event
        - created_on
      properties:
        id:
          type: string
          format: uuid
          description: Unique ID of this webhook delivery.
          example: "11ef0000-0000-4000-8000-000000000001"
        event:
          type: string
          title: SubscriptionEvent
          enum:
            - subscription_created
            - subscription_payment
            - subscription_completed
            - subscription_failure
            - subscription_canceled
            - subscription_suspended
          example: subscription_created
          description: >-
            Event type discriminator — `subscription_created`,
            `subscription_payment`, `subscription_completed`,
            `subscription_failure`, `subscription_canceled`, or
            `subscription_suspended`.
        data:
          $ref: "#/components/schemas/Subscription"
        created_on:
          type: string
          format: date-time
          description: Timestamp when the event was fired.
          example: "2026-04-09T07:35:50.000000Z"
      example:
        id: "11ef0000-0000-4000-8000-000000000001"
        event: subscription_created
        data:
          id: "11ef335e-9aa5-c54a-8313-7f9847da313a"
          store_id: "11edf541-c42d-653c-8c3d-dfe0a55f95c0"
          transaction_token_id: "11ef32a7-3a71-8662-803f-1bc27702eeec"
          amount: 1250
          currency: USD
          amount_formatted: 12.50
