  /stores/{storeId}/tokens/{id}/three_ds/issuer_token:
    get:
      tags:
        - Transaction Tokens
        - PCI DSS Required
      summary: Get 3-D Secure Issuer Token (Recurring Token)
      operationId: getTokenThreeDsIssuerToken
      x-operation-settings: *errorTemplates
      description: >-
        Retrieves the information required to execute 3-D Secure authentication
        when creating a recurring transaction token.

        **⚠️ Important Notes:** 1. **PCI DSS Compliance:** This endpoint is only
        available to PCI DSS compliant merchants who are authorized to send raw
        card data directly via the API to create tokens. 2. **Target Tokens:**
        This only applies to tokens where `type` is `recurring`. For `one_time`
        or `subscription` tokens, 3-D Secure is requested during charge
        creation, not token creation. 3. **Execution Flow:**
           - After creating the token, poll the token object until `data.three_ds.status` becomes `awaiting`.
           - Once `awaiting`, use this endpoint to fetch the issuer token details.
           - Format the returned `payload` according to the `content_type` (e.g., URL-encoded) and execute an `http_post` request from the consumer's browser to the `issuer_token` URL.
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 3-D Secure authentication details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreeDsIssuerToken"
              examples:
                tokenThreeDsExample:
                  $ref: "#/components/examples/TokenThreeDsIssuerTokenExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  # ========================================================================
  # SUBSCRIPTIONS PATHS
