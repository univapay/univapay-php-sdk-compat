          description: Search by metadata values.
          example: "order_id:12345"
        - name: status
          in: query
          required: false
          description: Filter subscriptions by current status.
          schema:
            $ref: "#/components/schemas/SubscriptionStatus"
          example: current
        - name: mode
          in: query
          required: false
          description: Filter subscriptions by processing mode.
          schema:
            $ref: "#/components/schemas/ChargeMode"
          example: live
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/CursorDirectionQuery"
