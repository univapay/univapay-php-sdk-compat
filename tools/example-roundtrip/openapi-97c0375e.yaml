    TokenCreateQrScanData:
      type: object
      required:
        - scanned_qr
      properties:
        scanned_qr:
          type: string
          description: >-
            The QR/barcode payload scanned from the customer's payment app
            (Customer-Presented Mode). Only valid when `type` is `one_time` —
            the server rejects `subscription`/`recurring` token types for
            this payment type.
          example: "091234567890123456789012345"
      example:
        scanned_qr: "091234567890123456789012345"

      description: Token Create Qr Scan Data schema.
    TokenResponseQrScanData:
      type: object
      required:
        - brand
      properties:
        brand:
          type: string
          nullable: true
          description: >-
            QR-CPM brand detected from the scanned code (e.g. `pay_pay`,
            `we_chat`, `qq`, `line_pay`, `au_pay`, `alipay_china`). This is
            an open value set — new brands may appear without notice.
            Returned as `null` when the scanned code could not be parsed
            into a known brand.
          example: pay_pay
      example:
        brand: pay_pay

      description: Token Response Qr Scan Data schema.
    TokenCreateQrMerchantData:
      type: object
      required:
        - brand
      properties:
        brand:
          type: string
          description: >-
            The QR-MPM brand to generate a merchant-presented-mode code for.
            Validated strictly server-side against a supported brand list.
            Common values include `rakuten_pay_merchant`,
            `alipay_merchant_qr`, `pay_pay_merchant`, `d_barai_mpm`,
            `we_chat_mpm`. Treat this as an open value set — the server may
            add brands over time.
          example: pay_pay_merchant
      example:
        brand: pay_pay_merchant

      description: Token Create Qr Merchant Data schema.
    TokenResponseQrMerchantData:
      type: object
      required:
        - qr_image_url
      properties:
        qr_image_url:
          type: string
          nullable: true
          description: >-
            QR code payload to be rendered by the consumer (content varies
            by brand — may be a URL or an opaque code). Some brands return
            an image URL; others (e.g. convenience-store QR brands) return
            an opaque numeric code with no URL structure. Populated
            asynchronously shortly after token/charge creation — `null`
            until then.
          example: "71001234567890202604141200450"
        brand:
          type: string
          nullable: true
          description: The QR-MPM brand this code was generated for.
          example: pay_pay_merchant
      example:
        qr_image_url: "71001234567890202604141200450"
        brand: pay_pay_merchant

      description: Token Response Qr Merchant Data schema.
    TokenCreatePaidyDataShippingAddress:
