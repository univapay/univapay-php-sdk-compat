      operationId: enableTokenThreeDs
      x-operation-settings: *errorTemplates
      description: >-
        Enables 3-D Secure on an existing `recurring` transaction token that
        was created without it. Only applies to `recurring` tokens; returns
        an error if 3DS is already enabled. After calling this endpoint, poll
        the token until `data.three_ds.status` becomes `awaiting`, then use
        the token 3DS issuer token endpoint to complete authentication.
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
