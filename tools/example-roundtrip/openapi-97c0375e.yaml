    CustomsDeclarationCreateRequest:
      type: object
      required:
        - customs
        - merchant_customs_no
        - certificate_id
        - certificate_name
      description: >-
        Request body for creating a customs declaration. Backend currently accepts
        this shape only for WeChat Online and WeChat MPM charges.
      properties:
        customs:
          type: string
          description: WeChat customs authority code used for the declaration.
          example: TOKYO
        merchant_customs_no:
          type: string
          description: Merchant customs registration number.
          example: "1234567890"
        certificate_id:
          type: string
          description: Customer certificate or passport identifier used by customs.
          example: AB1234567
        certificate_name:
          type: string
          description: Customer name exactly as shown on the certificate.
          example: TARO YAMADA
