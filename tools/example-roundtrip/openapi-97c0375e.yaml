          description: Scheduled due date.
        zone_id:
          type: string
          example: Asia/Tokyo
          description: IANA timezone identifier.
        amount:
          type: integer
          example: 1000
          description: Amount in the smallest currency unit.
        currency:
          type: string
          example: JPY
          description: ISO-4217 currency code.
        amount_formatted:
          type: number
          example: 1000
          description: Amount formatted for display.
        is_paid:
          type: boolean
          example: false
          description: Whether the payment has been paid.
        is_last_payment:
          type: boolean
          example: false
          description: Whether this is the final payment in the schedule.
        created_on:
          type: string
          format: date-time
          example: "2026-04-22T12:00:00Z"
          description: Timestamp when the resource was created.
        updated_on:
          type: string
          format: date-time
          example: "2026-04-22T12:00:00Z"
          description: Timestamp when the resource was last updated.
        retry_date:
          type: string
          format: date
          nullable: true
          example: "2026-05-23"
          description: Scheduled retry date.
        terminate_with_status:
          $ref: "#/components/schemas/NullableSubscriptionTerminateWithStatus"

      description: Next scheduled payment details for a subscription.
