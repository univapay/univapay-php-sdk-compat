openapi: 3.1.0
info:
  title: Univapay Public API
  contact:
    name: Univapay Support
    url: https://univapay.com
    email: support@univapay.com
  description: >-
    OpenAPI specification for the Univapay Online Payment API.


    ## Authentication (JWT)

    This API uses JWT (JSON Web Tokens) for authentication via the HTTP
    `Authorization` header. To authenticate, you must generate an **Application
    Token** in the Univapay dashboard.  This generates two components: 1.
    **Token (`{jwt}`)** 2. **Secret (`{secret}`)**

      ### ⚠️ Security Warning
      The **Secret** grants extensive privileges (e.g., creating charges, capturing authorized card charges, refunding). 
      **NEVER expose the `{secret}` in frontend application code** (e.g., consumer browsers) or public repositories. It is strictly for backend server-to-server communication. 
      *Univapay is not responsible for accidents caused by leaked secrets.*

      ### Bearer Auth Formats
      Depending on where you are calling the API from, the Bearer format changes:

      * **Frontend / Browser (No Secret)**: `Bearer {jwt}`
        *(Used for Widgets or Inline Forms. You must register your allowed domains in the dashboard when creating the token).*
      * **Backend / Server (With Secret)**: `Bearer {secret}.{jwt}`
        *(Required for all backend processing).*

    We will assume that all requests are going to originate from a backend
    server thus, all requests will require the secret

      ### Token Types
      * **Store Token**: Grants full access to requests for that specific store.
      * **Merchant Token**: Can't create transaction tokens but can access data from multiple stores.
  version: 1.2.0
  # APIMatic-specific server configuration. This extension OVERRIDES the root
  # `servers:` block for APIMatic only (portal + SDK codegen), and it is the sole
  # way to express more than one base URL inside a single environment: a plain
  # OpenAPI `servers:` array with two entries is imported as two *environments*
  # (mutually exclusive), and path-/operation-level `servers:` overrides are
  # ignored outright. Direct Debit runs on its own host, so its operations select
  # the `direct debit` server via `x-server-name`.
  #
  # Keep this in sync with the root `servers:` block below, which stays truthful
  # for standards-based consumers (Prism, the reseller build). set-spec-env.sh
  # swaps the defaults in BOTH places.
  x-server-configuration:
    default-environment: production
    default-server: default
    environments:
      - name: production
        description: Production Server
        servers:
          # Both declaration forms are required, and neither alone validates:
          # each server needs its own `variables` map (it is checked as a standard
          # Server Object), AND the same templates must appear in the
          # `x-server-configuration.parameters` list below. With only `parameters`
          # the validator calls each URL's variable undefined; with only
          # `variables` it reports a missing server parameter definition.
          # As a result the validator emits two "Unused server template parameter"
          # warnings — `parameters` is environment-wide, so each server uses only one
          # of the two. Expected: sharing one parameter would make both URLs identical.
          - name: default
            url: "{baseUrl}"
            description: Production Server
            variables:
              baseUrl:
                default: https://api.univapay.com
                description: Base URL for the API
          - name: directDebit
            url: "{directDebitBaseUrl}"
            description: Direct Debit - Production Server
            variables:
              directDebitBaseUrl:
                default: https://direct-debit.gopay-services.com
                description: Base URL for the Direct Debit API
    parameters:
      - name: baseUrl
        description: Base URL for the API
        schema:
          type: string
          default: https://api.univapay.com
      - name: directDebitBaseUrl
        description: Base URL for the Direct Debit API
        schema:
          type: string
          default: https://direct-debit.gopay-services.com
servers:
  # Defaults to Staging locally and on non-master builds; CI swaps these entries to
  # Production on master builds, see deploy.yml.
  - url: "{baseUrl}"
    description: Production Server
    variables:
      baseUrl:
        default: https://api.univapay.com
        description: Base URL for the API
  - url: "{directDebitBaseUrl}"
    description: Direct Debit - Production Server
    variables:
      directDebitBaseUrl:
        default: https://direct-debit.gopay-services.com
        description: Base URL for the Direct Debit API

tags:
  - name: Charges
    description: Endpoints to create and manage payments, authorizations, captures, and check payment status.
  - name: Transaction Tokens
    description: Endpoints to securely store and manage consumer payment information (Cards, Konbini, QR).
  - name: PCI DSS Required
    description: >-
      ⚠️ **Security Warning**: Endpoints with this tag can process credit card
      data (like card numbers or CVVs).  If you are using these endpoints for
      credit card payments, your server environment MUST be PCI DSS compliant.
  - name: Refunds
    description: Endpoints to create and manage refunds for charges.
  - name: Subscriptions
    description: Endpoints to create and manage recurring subscription payments.
  - name: Cancels
    description: Endpoints to create and manage cancellations for charges.
  - name: Merchants
    description: Merchant identity and effective configuration endpoints for authenticated operators.
  - name: Stores
    description: Store discovery and configuration endpoints for merchant contexts.
  - name: Webhooks
    description: Endpoints to create and manage store-level webhook subscriptions and view delivery history.
  - name: Direct Debit
    description: Endpoints to register consumer bank accounts and schedule recurring direct debit (口座振替) transfers, debited on a fixed monthly cycle.
  # NOTE: tags are APPEND-ONLY. translation-ja.json addresses tag descriptions
  # positionally (/tags/N/description), so inserting a tag anywhere but the end
  # of this list silently re-points every following Japanese string at the
  # wrong tag. Always add new tags after the current final entry — currently
  # Transaction History (index 11).
  - name: Checkout
    description: Endpoints to retrieve the merchant's checkout widget configuration — enabled payment methods, limits, branding, and per-brand feature support.
  - name: Transaction History
    description: Endpoints to search a unified, cross-payment-type history of charges and refunds.

components:
  securitySchemes:
    JWT_TOKEN:
      type: http
      scheme: bearer
      description: >-
        Required for requests. Format: `Bearer {secret}.{jwt}`
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: An optional idempotency key to prevent double charges and duplicate operations. We recommend a randomly generated UUID (v4).
      schema:
        description: Client-generated key, typically a UUID v4.
        type: string
      example: f64be872-353d-4c3c-84cb-3dc617fe89f7
    MerchantIdPath:
      name: merchantId
      in: path
      required: true
      description: The unique identifier of the merchant.
      schema:
        description: UUID of the merchant.
        type: string
        format: uuid
      example: 01234567-89ab-cdef-0123-456789abcdef
    StoreIdPath:
      name: storeId
      in: path
      required: true
      description: The unique identifier of the store.
      schema:
        description: UUID of the store.
        type: string
        format: uuid
      example: 0cab399b-5621-425b-993b-f8507eba1e78
    IdPath:
      name: id
      in: path
      required: true
      description: The unique identifier of the resource.
      schema:
        description: UUID of the resource.
        type: string
        format: uuid
      example: c4e87129-cad4-47fb-8ded-b4c0a4ae0dd4
    LimitQuery:
      name: limit
      in: query
      description: Maximum number of resources to return in one page.
      schema:
        type: integer
        default: 10
        maximum: 100
        description: >-
          Number of resources to return.  Must be an integer between 10 and 100.
      example: 10
    CursorQuery:
      name: cursor
      in: query
      description: Cursor pointing to the resource after which pagination should continue.
      schema:
        type: string
        format: uuid
        description: >-
          The ID of the resource to use as a starting position.  The results
          will start from the resource immediately following this ID.
      example: 3541d4fa-596d-428e-8a36-f274e1b3d505
    CursorDirectionQuery:
      name: cursor_direction
      in: query
      description: Pagination direction relative to the supplied cursor.
      schema:
        $ref: "#/components/schemas/CursorDirectionQuery"
      example: asc

    CardLastFourQuery:
      name: last_four
      in: query
      schema:
        description: The last four digits of the card number.
        type: string
      description: >-
        Filter by the last 4 digits of the card.  **Note:** If specified,
        `name`, `exp_month`, and `exp_year` must also be included.
      example: "4242"
    CardNameQuery:
      name: name
      in: query
      schema:
        description: Cardholder name as printed on the card.
        type: string
      description: >-
        Filter by cardholder name.  **Note:** If specified, `last_four`,
        `exp_month`, and `exp_year` must also be included.
      example: "TARO YAMADA"
    CardExpMonthQuery:
      name: exp_month
      in: query
      schema:
        description: Card expiration month, 1 to 12.
        type: integer
      description: >-
        Filter by expiration month.  **Note:** If specified, `last_four`,
        `name`, and `exp_year` must also be included.
      example: 12
    CardExpYearQuery:
      name: exp_year
      in: query
      schema:
        description: Card expiration year, four digits.
        type: integer
      description: >-
        Filter by expiration year.  **Note:** If specified, `last_four`, `name`,
        and `exp_month` must also be included.
      example: 2026
    FromDateQuery:
      name: from
      in: query
      schema:
        description: An ISO-8601 date-time.
        type: string
      description: Show charges created on or after this date (ISO-8601).
      example: "2026-04-01T00:00:00Z"
    ToDateQuery:
      name: to
      in: query
      schema:
        description: An ISO-8601 date-time.
        type: string
      description: Show charges created before this date (ISO-8601).
      example: "2026-04-30T23:59:59.999000Z"
    EmailQuery:
      name: email
      in: query
      schema:
        description: An email address.
        type: string
        format: email
      description: Filter by email address.
      example: user@example.com
    PhoneQuery:
      name: phone
      in: query
      schema:
        description: A phone number.
        type: string
      description: Filter by phone number.
      example: "+8108012341234"
    AmountFromQuery:
      name: amount_from
      in: query
      schema:
        description: An amount in the currency's minor unit.
        type: integer
      description: Show charges with an amount greater than or equal to this value.
      example: 1000
    AmountToQuery:
      name: amount_to
      in: query
      schema:
        description: An amount in the currency's minor unit.
        type: integer
      description: Show charges with an amount strictly less than this value.
      example: 5000
    CurrencyQuery:
      name: currency
      in: query
      schema:
        description: A three-letter ISO-4217 currency code.
        type: string
      description: Filter by currency (ISO-4217).
      example: "JPY"
    ModeQuery:
      name: mode
      in: query
      schema:
        $ref: "#/components/schemas/ModeQuery"
      description: Filter by environment mode.
      example: live
    MetadataQuery:
      name: metadata
      in: query
      schema:
        description: A metadata key or value to match.
        type: string
      description: Filter by metadata.
      example: "order_id: 12345"
    TransactionTokenIdQuery:
      name: transaction_token_id
      in: query
      schema:
        description: UUID of the transaction token.
        type: string
        format: uuid
      description: Filter by transaction token ID.
      example: f33b673e-564c-4645-ae17-ca03846a86b7
    ShortIdQuery:
      name: short_id
      in: query
      schema:
        description: The resource's short identifier.
        type: string
      description: Filter by short identifier.
      example: st_01hxy9p8zw4d
    SearchQuery:
      name: search
      in: query
      schema:
        description: Free-text search term.
        type: string
      description: Case-insensitive free-text search.
      example: tokyo
    CustomerIdQuery:
      name: customer_id
      in: query
      schema:
        description: UUID of the customer.
        type: string
        format: uuid
      description: Filter by customer ID.
      example: 8a3f1b8e-2c1a-4b7a-9c2e-6f6b6f6e2b10
    TransactionTokenListTypeQuery:
      name: type
      in: query
      schema:
        $ref: "#/components/schemas/TransactionTokenListType"
      description: >-
        Filter by token type. `one_time` tokens are excluded from listings and
        cannot be filtered on; filtering to `recurring` requires the App
        Token Secret.
      example: recurring
    TransactionTokenActiveQuery:
      name: active
      in: query
      schema:
        $ref: "#/components/schemas/TransactionTokenActiveFilter"
      description: Filter recurring tokens by whether they are still active.
      example: active
    SubscriptionIdPath:
      name: subscriptionId
      in: path
      required: true
      schema:
        description: UUID of the subscription.
        type: string
        format: uuid
      description: The unique identifier of the subscription.
      example: 25d0fb2c-18ef-11e7-9dd3-db8fb7b820e7
    ChargeIdPath:
      name: chargeId
      in: path
      required: true
      schema:
        description: UUID of the charge.
        type: string
        format: uuid
      description: The unique identifier of the charge.
      example: 6efb4e5c-690a-40f3-a4f1-0e19c5f84e98
    CustomsDeclarationIdPath:
      name: id
      in: path
      required: true
      schema:
        description: UUID of the customs declaration.
        type: string
        format: uuid
      description: The unique identifier of the customs declaration.
      example: 11ef0000-0000-4000-8000-000000000040

    SubscriptionScheduledPaymentIdPath:
      name: paymentId
      in: path
      required: true
      schema:
        description: UUID of the scheduled payment.
        type: string
        format: uuid
      description: The unique identifier of the scheduled payment of a subscription
      example: 11e89a0a-8cee-d660-b984-3fcaaed46e7c

    WebhookEventIdPath:
      name: eventId
      in: path
      required: true
      schema:
        description: UUID of the webhook event.
        type: string
        format: uuid
      description: The unique identifier of the webhook event.
      example: e1f2a3b4-c5d6-7890-efab-123456789cde

    # ======================================================================
    # DIRECT DEBIT PARAMETERS (口座振替)
    #
    # LimitQuery and CursorDirectionQuery above are reused as-is. CursorQuery
    # is not: direct debit resource IDs are numeric, not UUIDs.
    # ======================================================================
    DirectDebitBankAccountIdPath:
      name: bankAccountId
      in: path
      required: true
      description: The unique identifier of the direct debit bank account.
      schema:
        $ref: "#/components/schemas/DirectDebitBankAccountId"
      example: "1098116"
    DirectDebitBankTransferIdPath:
      name: bankTransferId
      in: path
      required: true
      description: The unique identifier of the direct debit bank transfer.
      schema:
        $ref: "#/components/schemas/DirectDebitBankTransferId"
      example: "2594976"
    DirectDebitCursorQuery:
      name: cursor
      in: query
      description: Cursor pointing to the resource after which pagination should continue.
      schema:
        type: string
        pattern: ^[0-9]+$
        description: The ID of the resource to use as a starting position.  Results start from the resource immediately following this ID.
      example: "1098116"
    DirectDebitUserNumberQuery:
      name: user_number
      in: query
      description: Filter by the merchant's own membership number for the consumer (会員番号).
      schema:
        $ref: "#/components/schemas/DirectDebitUserNumber"
      example: SD02688328
    DirectDebitBankAccountIdQuery:
      name: bank_account_id
      in: query
      description: Filter by a single bank account ID.
      schema:
        $ref: "#/components/schemas/DirectDebitBankAccountId"
      example: "1098116"
    DirectDebitBankCodeQuery:
      name: bank_code
      in: query
      description: Filter by the 4-digit bank code (銀行コード).
      schema:
        $ref: "#/components/schemas/DirectDebitBankCode"
      example: "0012"
    DirectDebitBankNameQuery:
      name: bank_name
      in: query
      description: Filter by bank name in half-width katakana (銀行名).
      schema:
        $ref: "#/components/schemas/DirectDebitBankName"
      example: ﾗｸﾃﾝｷﾞﾝｺｳ
    DirectDebitBranchCodeQuery:
      name: branch_code
      in: query
      description: Filter by the 3-digit branch code (支店コード).
      schema:
        $ref: "#/components/schemas/DirectDebitBranchCode"
      example: "120"
    DirectDebitBankAccountTypeQuery:
      name: bank_account_type
      in: query
      description: Filter by deposit account type (預金種類).
      schema:
        $ref: "#/components/schemas/DirectDebitBankAccountType"
      example: regular
    DirectDebitBankAccountNumberQuery:
      name: bank_account_number
      in: query
      description: Filter by the 7-digit account number (口座番号).
      schema:
        $ref: "#/components/schemas/DirectDebitBankAccountNumber"
      example: "1234567"
    DirectDebitBankAccountNameQuery:
      name: bank_account_name
      in: query
      description: Filter by account holder name in half-width katakana (口座名義).
      schema:
        $ref: "#/components/schemas/DirectDebitBankAccountName"
      example: ﾀﾅｶﾕﾐｺ
    DirectDebitRegistrationOriginQuery:
      name: registration_origin
      in: query
      description: Filter by where the bank account was registered from.
      schema:
        $ref: "#/components/schemas/DirectDebitRegistrationOrigin"
      example: merchant_console
    DirectDebitBankAccountStatusQuery:
      name: bank_account_status
      in: query
      description: Filter by bank account status. Omit to return every status.
      schema:
        $ref: "#/components/schemas/DirectDebitBankAccountStatus"
      example: active
    DirectDebitCreatedFromQuery:
      name: from
      in: query
      description: Show bank accounts created on or after this date (ISO-8601).
      # Deliberately no `format: date-time`, matching FromDateQuery/ToDateQuery above.
      # With the format, statically-typed SDKs generate a native date type whose
      # serialization Prism rejects against the schema (caught by the Java Layer 2
      # listDirectDebitBankAccounts test returning 400).
      schema:
        description: An ISO-8601 date-time.
        type: string
      example: "2026-04-01T00:00:00.000Z"
    DirectDebitCreatedToQuery:
      name: to
      in: query
      description: Show bank accounts created before this date (ISO-8601).
      schema:
        description: An ISO-8601 date-time.
        type: string
      example: "2026-04-30T23:59:59.999Z"
    DirectDebitBankTransferIdQuery:
      name: bank_transfer_id
      in: query
      description: Filter by a single bank transfer ID.
      schema:
        $ref: "#/components/schemas/DirectDebitBankTransferId"
      example: "2594976"
    DirectDebitBankTransferStartQuery:
      name: bank_transfer_start
      in: query
      description: Start of the year-month range in which the transfer is scheduled to occur.
      schema:
        $ref: "#/components/schemas/DirectDebitYearMonth"
      example: 2026-01
    DirectDebitBankTransferEndQuery:
      name: bank_transfer_end
      in: query
      description: End of the year-month range in which the transfer is scheduled to occur.
      schema:
        $ref: "#/components/schemas/DirectDebitYearMonth"
      example: 2026-03
    DirectDebitDebitDateQuery:
      name: debit_date
      in: query
      description: Filter by monthly debit cycle.
      schema:
        $ref: "#/components/schemas/DirectDebitDebitDate"
      example: fourteen
    DirectDebitLockStatusQuery:
      name: lock_status
      in: query
      description: Filter by lock status. Omit to return both locked and unlocked transfers.
      schema:
        $ref: "#/components/schemas/DirectDebitBankTransferLock"
      example: unlocked
    DirectDebitBankTransferStatusQuery:
      name: bank_transfer_status
      in: query
      description: Filter by transfer status. Omit to return every status.
      schema:
        $ref: "#/components/schemas/DirectDebitBankTransferStatus"
      example: awaiting

    # ==========================================================================
    # TRANSACTION HISTORY
    # ==========================================================================
    TransactionHistoryModeQuery:
      name: mode
      in: query
      description: Filter by environment mode.
      schema:
        $ref: "#/components/schemas/TransactionHistoryMode"
      example: test
    TransactionHistoryShortIdQuery:
      name: short_id
      in: query
      description: Filter by the last 6 characters of a resource's UUID. Must be exactly 6 characters.
      schema:
        description: The last 6 characters of the charge or refund's UUID.
        type: string
      example: "8bfc29"
    TransactionHistoryFromQuery:
      name: from
      in: query
      description: >-
        Show rows created on or after this date. Accepts epoch-millis or an
        ISO-8601 date-time. Must not be later than `to`.
      schema:
        description: Start of the date range, as epoch-millis or an ISO-8601 date-time.
        type: string
      example: "2026-04-01T00:00:00Z"
    TransactionHistoryToQuery:
      name: to
      in: query
      description: >-
        Show rows created on or before this date. Accepts epoch-millis or
        an ISO-8601 date-time. Must not be earlier than `from`.
      schema:
        description: End of the date range, as epoch-millis or an ISO-8601 date-time.
        type: string
      example: "2026-04-30T23:59:59.999Z"
    TransactionHistoryStatusQuery:
      name: status
      in: query
      description: Filter by status. Accepts any charge or refund status value.
      schema:
        $ref: "#/components/schemas/TransactionHistoryStatus"
      example: successful
    TransactionHistoryTypeQuery:
      name: type
      in: query
      description: Filter by row type.
      schema:
        $ref: "#/components/schemas/TransactionHistoryType"
      example: charge
    TransactionHistorySearchQuery:
      name: search
      in: query
      description: >-
        Free-text search across cardholder/customer name and email. Wrap a
        value in quotes (`"first last"`) for an exact-phrase match; an
        unquoted value matches partially.
      schema:
        description: Free-text search term.
        type: string
      example: "Taro Yamada"
    TransactionHistoryIdQuery:
      name: id
      in: query
      description: Filter by exact charge or refund ID.
      schema:
        description: UUID of the charge or refund.
        type: string
        format: uuid
      example: 11ef0000-0000-4000-8000-000000000070
    TransactionHistoryCardExpQuery:
      name: card_exp
      in: query
      description: Filter by card expiration, in `yyyy-MM` format.
      schema:
        description: Card expiration in `yyyy-MM` format.
        type: string
      example: "2026-04"
    TransactionHistoryCardLastFourQuery:
      name: card_last_four
      in: query
      description: Filter by the last 4 digits of the card. Must be exactly 4 characters.
      schema:
        description: The last 4 digits of the card number.
        type: string
      example: "4242"
    TransactionHistoryCardholderQuery:
      name: cardholder
      in: query
      description: >-
        Filter by cardholder name. Partial match by default; wrap in quotes
        for an exact-phrase match.
      schema:
        description: Cardholder name to search for.
        type: string
      example: "TARO YAMADA"
    TransactionHistoryCardBrandQuery:
      name: card_brand[]
      in: query
      style: form
      explode: true
      deprecated: true
      description: >-
        Deprecated legacy alias of `brand`; use `brand` instead. Repeatable
        via the `[]` suffix (e.g. `card_brand[]=visa&card_brand[]=jcb`). Raw
        brand identifiers vary by payment type — see the `user_data.brand`
        field on this endpoint's response.
      schema:
        type: array
        items:
          description: A raw brand identifier.
          type: string
        description: List of raw brand identifiers to match (OR'd together).
      example: [visa]
    TransactionHistoryBrandQuery:
      name: brand[]
      in: query
      style: form
      explode: true
      description: >-
        Filter by brand. Repeatable via the `[]` suffix (e.g.
        `brand[]=visa&brand[]=jcb`). Raw brand identifiers vary by payment
        type — see the `user_data.brand` field on this endpoint's response.
      schema:
        type: array
        items:
          description: A raw brand identifier.
          type: string
        description: List of raw brand identifiers to match (OR'd together).
      example: [visa]
    TransactionHistoryBrandsQuery:
      name: brands[]
      in: query
      style: form
      explode: true
      deprecated: true
      description: >-
        Deprecated legacy alias of `brand`; use `brand` instead. Repeatable
        via the `[]` suffix (e.g. `brands[]=visa&brands[]=jcb`). Raw brand
        identifiers vary by payment type — see the `user_data.brand` field
        on this endpoint's response.
      schema:
        type: array
        items:
          description: A raw brand identifier.
          type: string
        description: List of raw brand identifiers to match (OR'd together).
      example: [visa, jcb]
    TransactionHistoryServiceProviderQuery:
      name: service_provider
      in: query
      description: Filter by service provider.
      schema:
        $ref: "#/components/schemas/TransactionHistoryServiceProvider"
      example: credit
    TransactionHistoryServiceProvidersQuery:
      name: service_providers[]
      in: query
      style: form
      explode: true
      description: >-
        Filter by service provider. Repeatable via the `[]` suffix (e.g.
        `service_providers[]=credit&service_providers[]=paidy`). Must not be
        empty; duplicate values are deduplicated.
      schema:
        description: List of service providers to match (OR'd together).
        type: array
        items:
          $ref: "#/components/schemas/TransactionHistoryServiceProvider"
      example: [credit, paidy]
    TransactionHistoryGatewayTransactionIdQuery:
      name: gateway_transaction_id
      in: query
      description: Filter by the gateway's own transaction ID (free text).
      schema:
        description: The gateway's own transaction ID.
        type: string
      example: "gw-txn-00123456"
    TransactionHistoryBankTransferPaymentStatusesQuery:
      name: bank_transfer_payment_statuses[]
      in: query
      style: form
      explode: true
      description: >-
        Filter bank transfer rows by payment status. Repeatable via the `[]`
        suffix (e.g.
        `bank_transfer_payment_statuses[]=unpaid&bank_transfer_payment_statuses[]=exact`).
      schema:
        description: List of bank transfer payment statuses to match (OR'd together).
        type: array
        items:
          $ref: "#/components/schemas/BankTransferPaymentStatus"
      example: [exact]
    TransactionHistoryBankTransferLatestDepositDateFromQuery:
      name: bank_transfer_latest_deposit_date.from
      in: query
      description: >-
        Start of the range (inclusive) for `bank_transfer_latest_deposit_date`.
        Accepts epoch-millis or an ISO-8601 date-time.
      schema:
        description: Start of the deposit-date range, as epoch-millis or an ISO-8601 date-time.
        type: string
      example: "2026-04-01T00:00:00Z"
    TransactionHistoryBankTransferLatestDepositDateToQuery:
      name: bank_transfer_latest_deposit_date.to
      in: query
      description: >-
        End of the range (inclusive) for `bank_transfer_latest_deposit_date`.
        Accepts epoch-millis or an ISO-8601 date-time.
      schema:
        description: End of the deposit-date range, as epoch-millis or an ISO-8601 date-time.
        type: string
      example: "2026-04-30T23:59:59.999Z"

  responses:
    BadRequest:
      description: >-
        Bad Request (400). The request was invalid or could not be processed.  Common codes: VALIDATION_ERROR, INVALID_TOKEN_TYPE, NOT_SUPPORTED_BY_PROCESSOR.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            validationError:
              summary: Validation Error Example
              value:
                status: "error"
                code: "VALIDATION_ERROR"
                errors:
                  - field: "card_number"
                    reason: "INVALID_CARD_NUMBER"
            businessRuleError:
              summary: Business Rule Error Example
              value:
                status: "error"
                code: "CHARGE_AMOUNT_TOO_LOW"
                errors:
                  - reason: "Charge amount must exceed 100"

    Unauthorized:
      description: >-
        Unauthorized (401). Authentication failed.  Common codes: AUTH_HEADER_MISSING, INVALID_APP_TOKEN, INVALID_CREDENTIALS.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            unauthorizedError:
              summary: Unauthorized Example
              value:
                status: "error"
                code: "INVALID_APP_TOKEN"

    Forbidden:
      description: >-
        Forbidden (403). The request is understood, but access is refused.  This occurs if permissions are insufficient or if a security lock is triggered.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            cardLocked:
              summary: Card Locked Example
              description: Occurs when a card fails 5+ times in 30 minutes.
              value:
                status: "error"
                code: "CARD_LOCKED"
            invalidPermissions:
              summary: Invalid Permissions
              value:
                status: "error"
                code: "INVALID_PERMISSIONS"

    NotFound:
      description: >-
        Not Found (404). The requested resource (e.g., Store ID or Token ID) does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: "error"
            code: "NOT_FOUND"
    TooManyRequests:
      description: >-
        Too Many Requests (429). Rate limit exceeded. Returns an empty JSON object in this spec.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptyJsonObject"
          example: {}
    WebhookAcknowledged:
      description: Return 200 to acknowledge receipt of the event. Returns an empty JSON object.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptyJsonObject"
          example: {}
  schemas:
    # ========================================================================
    # ERROR SCHEMAS
    # ========================================================================
    EmptyJsonObject:
      type: object
      additionalProperties: false
      description: Empty JSON object used for operations documented without a meaningful response payload.
      example: {}
    ApiErrorDetail:
      type: object
      properties:
        field:
          type: string
          description: The field name of the parameter that caused the error (lower_snake_case).
          example: card_number
        reason:
          type: string
          description: Detailed reason for the nested error (UPPER_SNAKE_CASE or English description).
          example: INVALID_CARD_NUMBER
      example:
        field: card_number
        reason: INVALID_CARD_NUMBER

      description: Structured detail entry describing a single API validation or business error.
    ApiError:
      type: object
      required:
        - status
        - code
      properties:
        status:
          $ref: "#/components/schemas/ApiErrorStatus"
        code:
          type: string
          description: |
            API Request Error Codes.

            | HTTP | Error Code | Description |
            | :--- | :--- | :--- |
            | 400 | ALREADY_CAPTURED | The target charge is already captured or authorization is incomplete. |
            | 400 | AUTH_NOT_SUPPORTED | The configured gateway does not support authorization. |
            | 400 | CANCEL_NOT_ALLOWED | This payment method does not support cancellation, or the charge status cannot be canceled. |
            | 400 | CANNOT_CHANGE_CANCELED_SUBSCRIPTION | A canceled subscription cannot be modified. |
            | 400 | CANNOT_CHANGE_TOKEN | The transaction token for a subscription in this state cannot be changed. |
            | 400 | CANNOT_REFUND_UNSUCCESSFUL_CHARGE | Charges in a state other than 'successful' cannot be refunded. |
            | 400 | CAPTURE_AMOUNT_TOO_LARGE | The capture amount exceeds the authorized amount. |
            | 400 | CARD_BRAND_NOT_SUPPORTED | The configured gateway does not support the specified card brand. |
            | 400 | CARD_COUNTRY_NOT_SUPPORTED | The configured gateway does not support the specified card issuing country. |
            | 400 | CARD_PROCESSING_DISABLED | Card processing is disabled for this payment method. |
            | 400 | CHARGE_TOO_QUICK | Attempted to create multiple charges with the same amount within 30 seconds for the same card or recurring token. |
            | 400 | CONVENIENCE_PROCESSING_DISABLED | Konbini processing is disabled for this payment method. |
            | 400 | CURRENCY_MUST_MATCH_CHARGE | The refund currency must match the original charge currency. |
            | 400 | CVV_REQUIRED | CVV is required. |
            | 400 | CVV_AUTHORIZATION_NOT_COMPLETED | CVV authorization failed. |
            | 400 | FILE_INVALID_TYPE | The uploaded file has an incorrect MIME type. |
            | 400 | FILE_MAX_SIZE_EXCEEDED | The uploaded file size is too large. |
            | 400 | FORBIDDEN_IP | The country determined by the request's IP address is not permitted. |
            | 400 | INSTALLMENT_MAX_PAYOUT_PERIOD_EXCEEDED | The installment payment period exceeds the maximum allowed period. |
            | 400 | INSTALLMENT_PAYMENT_TYPE_NOT_ALLOWED_FOR_PLAN | The payment method is not allowed for this installment plan. |
            | 400 | INSTALLMENT_INVALID_CYCLES_COUNT | The number of installment cycles is unavailable. |
            | 400 | INSTALLMENT_INVALID_PLAN | Unsupported installment plan. |
            | 400 | INVALID_PLATFORM | Invalid platform specified. |
            | 400 | INVALID_TOKEN_TYPE | Invalid transaction token type. |
            | 400 | INVALID_QR_SCAN_GATEWAY | The QR code scanning gateway is not configured or not active. |
            | 400 | LAST_NAME_REQUIRED | A space-separated last name is required for the cardholder. |
            | 400 | LIVE_MODE_NOT_ENABLED_WHEN_UNVERIFIED | Account review must be completed to use live mode. |
            | 400 | NO_DIRECT_CURRENCY_GATEWAY | No gateway available to process the payment without currency conversion. |
            | 400 | NO_GATEWAYS_AVAILABLE | No available gateways found. |
            | 400 | NO_TEST_CARD_IN_LIVE_MODE | Test cards cannot be used in live mode. |
            | 400 | NON_SUBSCRIPTION_PAYMENT | Please specify a one-time token or recurring token to create a charge. |
            | 400 | NOT_ONE_TIME_TOKEN | Only one-time tokens are supported. |
            | 400 | NOT_SUBSCRIPTION_TOKEN | Please specify a subscription or recurring token. |
            | 400 | PARTIAL_CAPTURE_NOT_SUPPORTED | Partial capture is not supported. |
            | 400 | PAYMENT_EXPIRATION_EXCEEDS_PERIOD | Payment expiration date exceeds the allowed cycle. |
            | 400 | PROCESSING_MODE_MISMATCH | Application token and transaction token modes do not match (e.g., live vs. test). |
            | 400 | QR_PROCESSING_DISABLED | QR processing is disabled for this payment method. |
            | 400 | RECURRING_TOKEN_DISABLED | Transaction token is disabled or the account lacks permission to use recurring tokens. |
            | 400 | RECURRING_USAGE_LIMIT_REQUIRED | The `usage_limit` parameter is required. |
            | 400 | RECURRING_USAGE_REQUIRES_CVV | CVV is required for recurring usage. |
            | 400 | REFUND_EXCEEDS_CHARGE_AMOUNT | The refund amount exceeds the charge amount. |
            | 400 | REFUND_NOT_ALLOWED | The payment method does not support refunds, or the refund was declined. |
            | 400 | REFUND_EXCEEDS_SALES | The refund amount exceeds the merchant's available balance limit. |
            | 400 | REFUND_NOT_WITHIN_BOUNDS | The combined partial refund amounts exceed the total charge amount. |
            | 400 | RESOURCE_LIMIT_REACHED | Resource limit reached. |
            | 400 | SUBSCRIPTION_ALREADY_ENDED | The subscription has already ended. |
            | 400 | TOKEN_FOR_WRONG_STORE | The transaction token's store differs from the subscription's store. |
            | 400 | TRANSACTION_ALREADY_PROCESSED | Used transaction tokens cannot be specified again. |
            | 400 | TRANSACTION_TOKEN_EXPIRED | The transaction token has expired. |
            | 400 | USAGE_LIMIT_NOT_APPLICABLE | `usage_limit` cannot be specified here. |
            | 400 | VALIDATION_ERROR | There is a validation error in the request parameters. Check `errors` for details. |
            | 400 | CHARGE_AMOUNT_TOO_HIGH | The charge amount exceeds the maximum allowed limit. |
            | 400 | NOT_SUPPORTED_BY_PROCESSOR | The gateway does not support this request. |
            | 401 | AUTH_HEADER_MISSING | The `Authorization` header is missing. |
            | 401 | EXPIRED_LOGIN_TOKEN | The login token has expired. |
            | 401 | INVALID_APP_TOKEN | The specified application token is invalid. |
            | 401 | INVALID_CREDENTIALS | Authentication credentials are invalid. |
            | 401 | INVALID_DOMAIN | The requested `Origin` domain is not registered for the specified application token. |
            | 401 | INVALID_LOGIN_TOKEN | The login token is invalid. |
            | 401 | DIRECT_CARD_TOKEN_CREATION_DISABLED | Cannot send raw card data due to lack of PCI DSS compliance. |
            | 403 | CARD_LOCKED | This card is temporarily locked due to exceeding the failure threshold within a certain period. |
            | 403 | INVALID_PERMISSIONS | The application token type is incorrect or the account lacks sufficient permissions. |
            | 403 | INSTALLMENT_PROCESSOR_INITIAL_AMOUNTS_NOT_SUPPORTED | Initial installment amount specification is not supported by this gateway. |
            | 403 | OUTDATED_APP_TOKEN | Application token version is outdated. Please create a new one. |
            | 403 | TEST_CARD_CANNOT_BE_BANNED | Test cards cannot be banned. |
            | 403 | INSTALLMENTS_NOT_ENABLED | Installment payments are not enabled. |
            | 409 | IDEMPOTENCY_KEY_CONFLICT | The specified idempotency key has been used previously for a different request. |
            | 409 | NON_UNIQUE_ACTIVE_TOKEN | An active transaction token already exists. |
            | 409 | WEBHOOK_URL_EXISTS | The specified Webhook URL is already registered. |
            | 500 | COULD_NOT_REFRESH_AUTH | Failed to refresh the login token. |
            | 500 | DB_ERROR | Internal database error. |
            | 500 | FILE_UPLOAD_ERROR | File upload failed. |
            | 500 | IMPROPER_AUTH | Authorization state is improper. |
            | 500 | TIMEOUT | A timeout occurred during internal processing. |
            | 500 | UNABLE_TO_GET_IDEMPOTENT_RESULT | Cache found for idempotency key, but failed to retrieve the previous processing result. |
            | 500 | UNKNOWN_ERROR | An unexpected error occurred. |
            | 503 | SERVICE_UNAVAILABLE_TRY_AGAIN | Service is temporarily unavailable. Please try again later. |
            | 504 | NO_GATEWAY_AVAILABLE_TO_PROCESS_THE_REQUEST | This request is not supported by the connected gateway system. |
          example: VALIDATION_ERROR
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ApiErrorDetail"
          example:
            - field: card_number
              reason: INVALID_CARD_NUMBER
          description: List of detailed API errors.
      example:
        status: error
        code: VALIDATION_ERROR
        errors:
          - field: card_number
            reason: INVALID_CARD_NUMBER
      description: Standard API error response payload.
    IssuerTokenPayload:
      type: object
      description: A dictionary containing necessary key-value pairs for sending the request.
      additionalProperties: true
      properties:
        request_data:
          type: string
          description: Generic payload key used by most payment providers.
          example: example
        sSpcd:
          type: string
          description: d-barai payment service code.
          example: "00000000000"
        sCptok:
          type: string
          description: d-barai coupon token.
          example: "11eefaef-e2d6-5e3c-3cj3-7f0a72dd9ba7%2Clive%2C9f132db784f807abe60a566634a9791fc979d9b0ed330d6314a6cfb29af39cae"
        sTerkn:
          type: string
          description: d-barai terminal key.
          example: "01"

      example: {}
    NullableIssuerTokenPayload:
      description: >-
        Key-value pairs required to complete the payment action, or null if not applicable.
        Used when `call_method` is `http_post`. When present, this JSON must be converted by
        the client to match the expected `content_type` (e.g., transformed into an
        `application/x-www-form-urlencoded` string) before sending the POST request.
      oneOf:
        - $ref: "#/components/schemas/IssuerTokenPayload"
        - type: "null"
          description: Null value indicating no issuer token payload is required.
          example: null
      example:
        request_data: example

    PaymentError:
      type: object
      description: |
        Payment errors that occur during resource processing (like Charges or Refunds).
        The HTTP status will return success (2xx), but the resource `status` will be `failed`, and this object will be populated.
      properties:
        code:
          type: integer
          description: |
            Payment Error Codes.

            | Code | Description |
            | :--- | :--- |
            | 301 | Card number error. |
            | 302 | Invalid expiration month. |
            | 303 | Invalid expiration year. |
            | 304 | Card expired. |
            | 305 | Security code (CVV) error. |
            | 306 | Card declined (authorization screening error). |
            | 307 | Invalid card. |
            | 308 | This card has not been approved by the card company. |
            | 309 | General error occurred. Detailed information can be confirmed in the dashboard. |
            | 310 | Invalid consumer data (invalid request data). |
            | 311 | Too many charges on the same card in a short period. Please wait and try again. |
            | 312 | This charge cannot be canceled. |
            | 313 | Authorization expired (during charge capture). |
            | 314 | This card has been reported stolen or invalidated by the issuer. |
            | 315 | Please contact the card issuer. |
            | 316 | Cardholder's last name is required. |
            | 317 | Partial capture is not supported. |
            | 318 | Partial refund is not supported. |
            | 319 | Suspected fraud (security restriction). |
            | 320 | An error occurred in the bank's system. |
            | 321 | Dynamic descriptor is not supported. |
            | 322 | Barcode/QR code is invalid. |
            | 323 | Barcode/QR code has expired. |
            | 324 | This barcode/QR code has already been processed. |
            | 325 | This barcode/QR code is currently being processed. |
            | 326 | Rejected due to a high-risk profile. |
            | 327 | Payment deadline (5-minute timeout) has expired. |
            | 328 | Recovery failed. Manual intervention is required. |
            | 329 | Refund failed. |
            | 330 | Insufficient funds. |
            | 331 | Metadata field value is invalid or missing. |
            | 332 | Cross-border transaction not permitted: missing ID. |
            | 333 | Cross-border transaction not permitted: missing phone number. |
            | 334 | Cross-border transaction not permitted: unauthorized payment method. |
            | 335 | Cross-border transaction not permitted: missing name. |
            | 336 | Exceeded the payment limit for this payment method. |
            | 337 | Exceeded the payment limit for this merchant. |
            | 338 | Payment information not found. |
            | 339 | Duplicate payment information. |
            | 340 | This consumer's retail QR account was rejected by the gateway. |
            | 341 | This merchant lacks the necessary information for this gateway. |
            | 342 | Cross-border transaction not permitted: unauthorized currency. |
            | 343 | Payment could not be processed due to a server error at the gateway. |
            | 344 | The selected payment method is temporarily unavailable from the gateway. |
            | 345 | The payment has already been canceled. |
            | 346 | Payment processing timed out due to system delay and was canceled. |
            | 351 | Invalid transaction. |
            | 355 | The card does not support the specified payment division (e.g., installments). |
            | 356 | The card is not registered for 3D Secure. |
            | 358 | 3D Secure authentication failed (consumer reason, e.g., wrong password). |
            | 359 | 3D Secure authentication failed (card company reason). |
            | 500 | A pre-processing error occurred during the request execution. |
            | 501 | An internal error occurred. Please contact support. |
            | 502 | The request timed out waiting for a response. |
            | 601 | A system-released error occurred in this service. Check details. |
            | 602 | The payment processor rejected the submitted request. Check details. |
            | 603 | The submitted customer identity verification was rejected by customs. |
            | 604 | The required customer ID information was not submitted by the merchant. |
          example: 301
        message:
          type: string
          description: A brief message detailing why the payment failed.
          example: Card number error.
        detail:
          type: string
          description: Further specific details regarding the payment failure, if available.
          example: The provided card number failed validation.
      example:
        code: 301
        message: Card number error.
        detail: The provided card number failed validation.

    GenericMetadataValue:
      description: >-
        Allowed values for metadata properties. Values may be a string,
        number, boolean, null, or an array of any of the above — but not a
        nested object; the server rejects metadata whose direct property
        values are JSON objects.
      nullable: true
      anyOf:
        - type: string
          example: sale
          description: String value.
        - type: number
          example: 10
          description: Numeric value.
        - type: boolean
          example: true
          description: Boolean value.
        - type: array
          items:
            description: A non-object JSON value (string, number, boolean, or null).
          example: ["sale", "promo"]
          description: Array value. Items may be any non-object JSON value.
      example: sale
    GenericMetadata:
      type: object
      description: A free-form dictionary for custom metadata.
      additionalProperties:
        $ref: "#/components/schemas/GenericMetadataValue"
      properties:
        order_id:
          type: string
          description: Example of a custom metadata key.
          example: example
        univapay-name:
          type: string
          description: Consumer name passed to payment processors that require it (e.g., konbini, bank transfer).
          example: TARO YAMADA
        univapay-phone-number:
          type: string
          description: Consumer phone number passed to payment processors that require it.
          example: "+81 08012341234"
      example:
        order_id: "12345"

    NullablePaymentError:
      description: Payment error details, or null if successful.
      oneOf:
        - $ref: "#/components/schemas/PaymentError"
        - type: "null"
          description: Null value indicating no payment error occurred.
          example: null
      example:
        code: 301
        message: Card number error.
        detail: The provided card number failed validation.
    # ========================================================================
    # CHARGES
    # ========================================================================
    ChargeCreateRequest:
      type: object
      required:
        - transaction_token_id
        - amount
        - currency
      properties:
        transaction_token_id:
          type: string
          format: uuid
          example: af834c88-7a8f-47ac-aee9-0386a0f98b0d
          description: Transaction token identifier.
        amount:
          type: integer
          description: The charge amount.
          example: 1000
        currency:
          type: string
          description: ISO-4217 currency code.
          default: JPY
          example: JPY
        capture:
          type: boolean
          default: true
          description: If false, creates an Authorization only (Hold).
        capture_at:
          type: string
          format: date-time
          description: >-
            Auto-capture date for cards, or payment deadline for Konbini/Bank.
            Note: Time specification is ignored for 7-Eleven, Seicomart, and
            PayEasy.
          example: "2026-04-09T10:00:00Z"
        merchant_transaction_id:
          type: string
          maxLength: 32
          description: >-
            Unique transaction ID for the merchant.  Required/used by specific
            brands like we_chat, we_chat_mpm, and we_chat_online.
          example: ORD-998877
        metadata:
          $ref: "#/components/schemas/GenericMetadata"
        client_metadata:
          $ref: "#/components/schemas/ChargeCreateRequestClientMetadata"
        redirect:
          $ref: "#/components/schemas/ChargeCreateRequestRedirect"
        three_ds:
          $ref: "#/components/schemas/ChargeCreateRequestThreeDs"

      description: Request payload for creating a charge.
      example:
        transaction_token_id: af834c88-7a8f-47ac-aee9-0386a0f98b0d
        amount: 1000
        currency: JPY
    Charge:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 6efb4e5c-690a-40f3-a4f1-0e19c5f84e98
          description: Unique identifier.
        store_id:
          type: string
          format: uuid
          example: 76cf4a64-02bc-4cb3-9a28-74622e5928a1
          description: Store identifier.
        transaction_token_id:
          type: string
          format: uuid
          example: af834c88-7a8f-47ac-aee9-0386a0f98b0d
          description: Transaction token identifier.
        transaction_token_type:
          $ref: "#/components/schemas/ChargeTransactionTokenType"
        subscription_id:
          type: string
          format: uuid
          nullable: true
          description: Subscription identifier.
          example: 11ef0000-0000-4000-8000-000000000001
        merchant_transaction_id:
          type: string
          nullable: true
          example: ORD-998877
          description: Merchant-defined transaction identifier.
        requested_amount:
          type: integer
          example: 1000
          description: Requested amount in the smallest currency unit.
        requested_currency:
          type: string
          example: JPY
          description: Requested ISO-4217 currency code.
        requested_amount_formatted:
          type: number
          example: 1000
          description: Requested amount formatted for display.
        charged_amount:
          type: integer
          nullable: true
          example: 1000
          description: Charged amount in the smallest currency unit.
        charged_currency:
          type: string
          nullable: true
          example: JPY
          description: Charged ISO-4217 currency code.
        charged_amount_formatted:
          type: number
          nullable: true
          example: 1000
          description: Charged amount formatted for display.
        fee_amount:
          type: integer
          nullable: true
          example: 30
          description: Fee amount in the smallest currency unit.
        fee_currency:
          type: string
          nullable: true
          example: JPY
          description: Fee ISO-4217 currency code.
        fee_amount_formatted:
          type: number
          nullable: true
          example: 30
          description: Fee amount formatted for display.
        only_direct_currency:
          type: boolean
          example: false
          description: Whether only direct currency processing is allowed.
        capture_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when capture should occur.
          example: "2026-04-09T07:35:50.000000Z"
        descriptor:
          type: string
          nullable: true
          example: UNIVAPAY TEST
          description: Billing descriptor.
        descriptor_phone_number:
          type: string
          nullable: true
          # Quoted: unquoted, YAML reads this as the integer 312345678 and the
          # leading zero disappears from the rendered example.
          example: "0312345678"
          description: Billing descriptor phone number.
        status:
          $ref: "#/components/schemas/ChargeStatus"
        error:
          $ref: "#/components/schemas/NullablePaymentError"
        metadata:
          $ref: "#/components/schemas/GenericMetadata"
        mode:
          $ref: "#/components/schemas/ChargeMode"
        created_on:
          type: string
          format: date-time
          example: "2026-04-09T07:35:50Z"
          description: Timestamp when the resource was created.
        merchant_name:
          type: string
          example: Test Merchant
          description: Merchant display name.
        store_name:
          type: string
          example: Tokyo Store
          description: Store display name.
        redirect:
          $ref: "#/components/schemas/ChargeRedirect"
        three_ds:
          $ref: "#/components/schemas/ChargeThreeDs"

      description: Charge resource returned by the payments API.
    ChargeUpdateRequest:
      type: object
      properties:
        metadata:
          $ref: "#/components/schemas/GenericMetadata"
      example:
        metadata:
          order_id: "12347"

      description: Request payload for updating charge metadata.
    ChargeCaptureRequest:
      type: object
      properties:
        amount:
          type: integer
          description: >-
            The amount to capture. Must be less than or equal to the
            authorized amount. If omitted, the full outstanding authorized
            amount is captured.
          example: 1000
        currency:
          type: string
          description: >-
            ISO-4217 currency code. Must exactly match the currency used
            during authorization. If omitted, defaults to the currency
            originally requested on the charge.
          example: JPY
      example:
        amount: 1000
        currency: JPY

      description: >-
        Request payload for capturing an authorized charge. Both fields are
        optional; omit the entire body to capture the full outstanding
        amount.
    ChargeList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Charge"
          description: List of resources.
          example:
            - id: "11ef32c4-9ea8-169c-a6c8-bfc29867a226"
              store_id: "11edf541-c42d-653c-8c3d-dfe0a55f95c0"
