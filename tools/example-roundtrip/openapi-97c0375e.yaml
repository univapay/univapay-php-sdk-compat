  /stores/{storeId}/subscriptions/{id}:
    get:
      tags: [Subscriptions]
      summary: Get Subscription (Long Polling Supported)
      operationId: getSubscription
      x-operation-settings: *errorTemplates
      description: >-
        Retrieves the details of an existing subscription.  Supports internal polling to wait for status changes.
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - name: id
          in: path
          required: true
          description: The Subscription ID.
          schema:
            description: UUID of the subscription.
            type: string
            format: uuid
          example: 11ef335e-9aa5-c54a-8313-7f9847da313a
        - name: polling
          in: query
          required: false
          schema:
            description: Whether to hold the request open until the status settles.
            type: boolean
          description: >-
            If set to true, instructs the API to internally poll the subscription  status until it changes from 'unverified' (the initial status) to  another status.
          example: true
