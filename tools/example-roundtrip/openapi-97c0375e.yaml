    ChargeCreateRequestThreeDs:
      type: object
      properties:
        redirect_endpoint:
          type: string
          format: uri
          description: URL to redirect the customer to after 3DS authentication.
          example: https://univapay.com/3ds-redirect
        mode:
          $ref: "#/components/schemas/ChargeCreateRequestThreeDsMode"
        authentication_value:
          type: string
          description: >-
            External MPI: the cardholder authentication value (CAVV/AAV)
            returned by the 3-D Secure directory server. Submit together with
            `eci`, `ds_transaction_id`, `server_transaction_id`,
            `message_version`, and `transaction_status` to provide externally
            completed 3DS authentication data — either all six fields must be
            present, or none of them.
          example: "AAABBEg0VhI0VniQEjRWAAAAAAA="
        eci:
          type: string
          description: >-
            External MPI: the two-digit Electronic Commerce Indicator
            returned by the directory server. Submit together with the other
            external MPI fields.
          example: "05"
        ds_transaction_id:
          type: string
          description: >-
            External MPI: the directory server transaction ID. Submit
            together with the other external MPI fields.
          example: f1234567-89ab-4cde-8f01-234567890abc
        server_transaction_id:
          type: string
          description: >-
            External MPI: the 3DS server transaction ID. Submit together with
            the other external MPI fields.
          example: b1234567-89ab-4cde-8f01-234567890abc
        message_version:
          type: string
          description: >-
            External MPI: the 3-D Secure protocol message version (e.g.,
            '2.1.0', '2.2.0'). Submit together with the other external MPI
            fields.
          example: "2.2.0"
        transaction_status:
          type: string
          description: >-
            External MPI: the 3-D Secure directory server transaction status.
            Only a successful authentication status is accepted. Submit
            together with the other external MPI fields.
          example: "Y"

      description: >-
        Charge Create Request Three Ds schema. Either supply `mode` (and
        optionally `redirect_endpoint`) to have Univapay run 3DS, or supply
        all six external-MPI fields (`authentication_value` through
        `transaction_status`) when 3DS authentication was already completed
        outside of Univapay — in that case `mode` is set to `provided`
        automatically and must not be sent.
