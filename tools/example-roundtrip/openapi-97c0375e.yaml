      type: string
      pattern: ^[0-9]+$
      description: Unique identifier of a direct debit bank transfer (振替ID).
      example: "2594976"

    DirectDebitUserNumber:
      type: string
      pattern: ^[a-zA-Z0-9]+$
      description: The merchant's own membership number for the consumer (会員番号). Alphanumeric.
      example: SD02688328

    DirectDebitBankCode:
      type: string
      pattern: ^[0-9]{4}$
      minLength: 4
      maxLength: 4
      description: Four-digit code identifying the consumer's bank (銀行コード).
      example: "0012"

    DirectDebitBankName:
      type: string
      maxLength: 15
      description: Bank name in half-width katakana (銀行名).
      example: ﾗｸﾃﾝｷﾞﾝｺｳ

    DirectDebitBranchCode:
      type: string
      pattern: ^[0-9]{3}$
      minLength: 3
      maxLength: 3
      description: Three-digit code identifying the bank branch (支店コード).
      example: "120"

    DirectDebitBankAccountType:
      type: string
      enum:
        - regular
        - current
        - savings
        - others
      description: Deposit account type (預金種類) — `regular` (普通), `current` (当座), `savings` (貯蓄) or `others` (その他).
      example: regular

    DirectDebitBankAccountName:
      type: string
      pattern: ^[A-Z0-9ｱ-ﾝﾞﾟ().\- ]{1,30}$
      maxLength: 30
      description: Account holder name (口座名義), in half-width katakana. Full-width characters are rejected by the bank.
      example: ﾀﾅｶﾕﾐｺ

    DirectDebitBankAccountNumber:
      type: string
      pattern: ^[0-9]{7}$
      minLength: 7
      maxLength: 7
      description: Seven-digit account number (口座番号).
      example: "1234567"

    DirectDebitRegistrationOrigin:
      type: string
      enum:
        - anywhere
        - merchant_console
      description: Where the bank account was registered from — `merchant_console` for the merchant dashboard, `anywhere` otherwise.
      example: merchant_console

    DirectDebitBankAccountStatus:
      type: string
      enum:
        - active
        - inactive
        - registration_failed
      description: >-
        Bank account state (有効・無効・登録失敗). Only an `active` account can have transfers registered against it. `registration_failed` means the bank rejected the account details.
      example: active

    DirectDebitYearMonth:
      type: string
      pattern: ^[0-9]{4}-[0-9]{2}$
      description: A calendar year and month, as `YYYY-MM`.
      example: 2026-01

    DirectDebitCalculatedDebitDate:
      type: string
      format: date
      description: The actual business day on which funds are pulled (計算された振替日), derived from the debit cycle.
      example: "2026-03-14"

    DirectDebitBankTransferAmount:
      type: integer
      format: int64
      minimum: 1
      description: Transfer amount in JPY. Must be a positive, non-zero whole number.
      example: 1000

    DirectDebitBankTransferLock:
      type: string
      enum:
        - unlocked
        - locked
      description: >-
        Whether the transfer can still be edited. Transfers are `unlocked` until the upload deadline for their debit cycle passes, after which they are `locked` and can no longer be changed or deleted.
      example: unlocked

    DirectDebitBankTransferStatus:
      type: string
      enum:
        - awaiting
        - successful
        - failed
      description: >-
        Transfer state. `awaiting` until the bank reports back, then `successful` or `failed`. Results are reflected days after the debit date, not immediately.
      example: awaiting

    DirectDebitBankTransferError:
      type: string
      enum:
        - insufficient_funds
        - no_deposit_transaction
        - transfer_stopped_by_depositor
        - no_account_transfer_request
        - transfer_stopped_by_trustee
        - other_error
        - unknown_error
      description: >-
        Reason a transfer failed, as reported by the bank.

        | Value | Meaning |
        | :--- | :--- |
        | `insufficient_funds` | The account did not hold enough money on the debit date. |
        | `no_deposit_transaction` | The account exists but has no deposit activity. |
        | `transfer_stopped_by_depositor` | The consumer instructed their bank to stop the debit. |
        | `no_account_transfer_request` | No valid direct debit mandate is on file for the account. |
        | `transfer_stopped_by_trustee` | The collecting bank stopped the debit. |
        | `other_error` | The bank reported a failure outside the categories above. |
        | `unknown_error` | The failure reason could not be determined. |
      example: insufficient_funds

    NullableDirectDebitBankTransferError:
      description: Failure reason, or null while the transfer is awaiting a result or has succeeded.
      oneOf:
        - $ref: "#/components/schemas/DirectDebitBankTransferError"
        - type: "null"
          description: Null value indicating the transfer has not failed.
          example: null
      example: insufficient_funds

    DirectDebitDebitDate:
      type: string
      enum:
        - fourteen
        - twenty_seven
      description: Monthly debit cycle — funds are pulled on either the 14th or the 27th.
      example: fourteen

    DirectDebitConsignorCode:
      type: string
      pattern: ^[0-9]{6}$
      minLength: 6
      maxLength: 6
      description: Consignor code (委託者コード) assigned by the collecting bank.
      example: "135456"

    DirectDebitClassifier:
      type: string
      pattern: ^[0-9]{2}$
      minLength: 2
      maxLength: 2
      description: Transfer classification code (区分) agreed with the collecting bank.
      example: "99"

    DirectDebitSignature:
      type: string
      description: Name printed on the consumer's bank statement (印字名), in half-width katakana.
      example: モモサン

    DirectDebitMerchantConfiguration:
      type: object
      description: The merchant's effective direct debit configuration.
      properties:
        legacy_id:
          $ref: "#/components/schemas/DirectDebitLegacyId"
        enabled:
          type: boolean
          description: Whether direct debit is enabled for this merchant.
          example: true
        debit_date:
          $ref: "#/components/schemas/DirectDebitDebitDate"
        consignor_code:
          $ref: "#/components/schemas/DirectDebitConsignorCode"
        classifier:
          $ref: "#/components/schemas/DirectDebitClassifier"
        signature:
          $ref: "#/components/schemas/DirectDebitSignature"

    DirectDebitNotificationConfiguration:
      type: object
      description: Which direct debit email notifications the merchant has opted into.
      properties:
        notify_deadline_mailing:
          type: boolean
          description: Notify when the deadline for the bank to receive the signed mandate approaches (郵送期限の通知).
          example: true
        notify_deadline_debit:
          type: boolean
          description: Notify when the transfer registration cutoff approaches (締切日の通知).
          example: true
        notify_debit_update:
          type: boolean
          description: Notify when transfer results are reflected (振替結果の通知).
          example: false

    DirectDebitSchedule:
      type: object
      description: >-
        The key dates for one debit cycle. Use these to work out whether the current month's registration window is still open.
      properties:
        merchant_bank_account_transfer_date:
          type: string
          format: date
          description: The date funds are pulled from consumer accounts (指定振替日).
          example: "2026-03-14"
        merchant_bank_account_registration_deadline:
          type: string
          format: date
          description: The date by which the bank must receive the signed direct debit mandate (振替依頼書到着期限).
          example: "2026-02-20"
        merchant_bank_transfer_upload_deadline:
          type: string
          format: date
          description: The last date transfers can be registered or edited for this cycle (振替データアップロード期限). After this, transfers lock.
          example: "2026-03-04"
        platform_result_registration_date:
          type: string
          format: date
          description: The date transfer results are reflected on the platform (振替結果反映日).
          example: "2026-03-24"
        platform_scheduled_payout:
          type: string
          format: date
          description: The date collected funds are paid out to the merchant (支払日).
          example: "2026-03-31"

    DirectDebitBankAccount:
      type: object
      description: A consumer bank account registered for direct debit.
      properties:
        id:
          $ref: "#/components/schemas/DirectDebitBankAccountId"
        legacy_store_id:
          $ref: "#/components/schemas/DirectDebitLegacyId"
        merchant_id:
          type: string
          format: uuid
          description: The merchant that owns this bank account.
          example: 01234567-89ab-cdef-0123-456789abcdef
        user_number:
          $ref: "#/components/schemas/DirectDebitUserNumber"
        bank_code:
          $ref: "#/components/schemas/DirectDebitBankCode"
        bank_name:
          $ref: "#/components/schemas/DirectDebitBankName"
        branch_code:
          $ref: "#/components/schemas/DirectDebitBranchCode"
        bank_account_type:
          $ref: "#/components/schemas/DirectDebitBankAccountType"
        bank_account_name:
          $ref: "#/components/schemas/DirectDebitBankAccountName"
        bank_account_number:
          $ref: "#/components/schemas/DirectDebitBankAccountNumber"
        registration_origin:
          $ref: "#/components/schemas/DirectDebitRegistrationOrigin"
        status:
          $ref: "#/components/schemas/DirectDebitBankAccountStatus"
        created_on:
          type: string
          format: date-time
          description: Timestamp when the resource was created.
          example: "2026-04-09T07:35:50.000Z"
        updated_on:
          type: string
          format: date-time
          description: Timestamp when the resource was last updated.
          example: "2026-04-09T07:35:50.000Z"

    DirectDebitBankAccountCreateRequest:
      type: object
      description: Request payload for registering a consumer bank account for direct debit.
      required:
        - user_number
        - bank_code
        - bank_name
        - branch_code
        - bank_account_type
        - bank_account_name
        - bank_account_number
      properties:
        user_number:
          $ref: "#/components/schemas/DirectDebitUserNumber"
        bank_code:
          $ref: "#/components/schemas/DirectDebitBankCode"
        bank_name:
          $ref: "#/components/schemas/DirectDebitBankName"
        branch_code:
          $ref: "#/components/schemas/DirectDebitBranchCode"
        bank_account_type:
          $ref: "#/components/schemas/DirectDebitBankAccountType"
        bank_account_name:
          $ref: "#/components/schemas/DirectDebitBankAccountName"
        bank_account_number:
          $ref: "#/components/schemas/DirectDebitBankAccountNumber"

    DirectDebitBankAccountUpdateRequest:
      type: object
      description: Request payload for updating a registered bank account. Omitted fields are left unchanged.
      properties:
        user_number:
          $ref: "#/components/schemas/DirectDebitUserNumber"
        bank_code:
          $ref: "#/components/schemas/DirectDebitBankCode"
        bank_name:
          $ref: "#/components/schemas/DirectDebitBankName"
        branch_code:
          $ref: "#/components/schemas/DirectDebitBranchCode"
        bank_account_type:
          $ref: "#/components/schemas/DirectDebitBankAccountType"
        bank_account_name:
          $ref: "#/components/schemas/DirectDebitBankAccountName"
        bank_account_number:
          $ref: "#/components/schemas/DirectDebitBankAccountNumber"

    DirectDebitBankAccountList:
      type: object
      description: Paginated list of direct debit bank accounts.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DirectDebitBankAccount"
          description: List of resources.
          example:
            - id: "1098116"
              legacy_store_id: "1283794"
              merchant_id: 01234567-89ab-cdef-0123-456789abcdef
              user_number: SD02688328
              bank_code: "0012"
              bank_name: ﾗｸﾃﾝｷﾞﾝｺｳ
              branch_code: "120"
              bank_account_type: regular
              bank_account_name: ﾀﾅｶﾕﾐｺ
              bank_account_number: "1234567"
              registration_origin: merchant_console
              status: active
              created_on: "2026-04-09T07:35:50.000Z"
              updated_on: "2026-04-09T07:35:50.000Z"
            - id: "1098117"
              legacy_store_id: "1283794"
              merchant_id: 01234567-89ab-cdef-0123-456789abcdef
              user_number: SD02688329
              bank_code: "0009"
              bank_name: ﾐﾂｲｽﾐﾄﾓ
              branch_code: "221"
              bank_account_type: current
              bank_account_name: ｽｽﾞｷﾀﾛｳ
              bank_account_number: "7654321"
              registration_origin: anywhere
              status: inactive
              created_on: "2026-04-10T09:12:04.000Z"
              updated_on: "2026-04-12T11:03:41.000Z"
        has_more:
          type: boolean
          description: Whether more results are available.
          example: false

    DirectDebitBankTransfer:
      type: object
      description: >-
        A single scheduled pull of funds from a registered bank account. The bank account details are copied onto the transfer at registration time, so later edits to the account do not change past transfers.
      properties:
        id:
          $ref: "#/components/schemas/DirectDebitBankTransferId"
        legacy_store_id:
          $ref: "#/components/schemas/DirectDebitLegacyId"
        merchant_id:
          type: string
          format: uuid
          description: The merchant that owns this transfer.
          example: 01234567-89ab-cdef-0123-456789abcdef
        bank_account_id:
          $ref: "#/components/schemas/DirectDebitBankAccountId"
        user_number:
          $ref: "#/components/schemas/DirectDebitUserNumber"
        bank_code:
          $ref: "#/components/schemas/DirectDebitBankCode"
        bank_name:
          $ref: "#/components/schemas/DirectDebitBankName"
        branch_code:
          $ref: "#/components/schemas/DirectDebitBranchCode"
        bank_account_type:
          $ref: "#/components/schemas/DirectDebitBankAccountType"
        bank_account_name:
          $ref: "#/components/schemas/DirectDebitBankAccountName"
        bank_account_number:
          $ref: "#/components/schemas/DirectDebitBankAccountNumber"
        amount:
          $ref: "#/components/schemas/DirectDebitBankTransferAmount"
        debit_date:
          $ref: "#/components/schemas/DirectDebitDebitDate"
        calculated_debit_date:
          $ref: "#/components/schemas/DirectDebitCalculatedDebitDate"
        lock:
          $ref: "#/components/schemas/DirectDebitBankTransferLock"
        status:
          $ref: "#/components/schemas/DirectDebitBankTransferStatus"
        error:
          $ref: "#/components/schemas/NullableDirectDebitBankTransferError"
        created_on:
          type: string
          format: date-time
          description: Timestamp when the resource was created.
          example: "2026-04-09T07:35:50.000Z"
        updated_on:
          type: string
          format: date-time
          description: Timestamp when the resource was last updated.
          example: "2026-04-09T07:35:50.000Z"

    DirectDebitBankTransferCreateRequest:
      type: object
      description: Request payload for scheduling a transfer against an active bank account.
      required:
        - amount
      properties:
        amount:
          $ref: "#/components/schemas/DirectDebitBankTransferAmount"

    DirectDebitBankTransferPatchRequest:
      type: object
      description: Request payload for changing a transfer's amount. Only permitted while the transfer is unlocked.
      required:
        - amount
      properties:
        amount:
          $ref: "#/components/schemas/DirectDebitBankTransferAmount"

    DirectDebitBankTransferList:
      type: object
      description: Paginated list of direct debit bank transfers.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DirectDebitBankTransfer"
          description: List of resources.
          example:
            - id: "2594976"
              legacy_store_id: "1283794"
              merchant_id: 01234567-89ab-cdef-0123-456789abcdef
              bank_account_id: "1098116"
              user_number: SD02688328
              bank_code: "0012"
              bank_name: ﾗｸﾃﾝｷﾞﾝｺｳ
              branch_code: "120"
              bank_account_type: regular
              bank_account_name: ﾀﾅｶﾕﾐｺ
              bank_account_number: "1234567"
              amount: 1000
              debit_date: fourteen
              calculated_debit_date: "2026-03-14"
              lock: unlocked
              status: awaiting
              error: null
              created_on: "2026-04-09T07:35:50.000Z"
              updated_on: "2026-04-09T07:35:50.000Z"
            - id: "2594977"
              legacy_store_id: "1283794"
              merchant_id: 01234567-89ab-cdef-0123-456789abcdef
              bank_account_id: "1098117"
              user_number: SD02688329
              bank_code: "0009"
              bank_name: ﾐﾂｲｽﾐﾄﾓ
              branch_code: "221"
              bank_account_type: current
              bank_account_name: ｽｽﾞｷﾀﾛｳ
              bank_account_number: "7654321"
              amount: 1850
              debit_date: twenty_seven
              calculated_debit_date: "2026-03-27"
              lock: locked
              status: failed
              error: insufficient_funds
              created_on: "2026-04-10T09:12:04.000Z"
