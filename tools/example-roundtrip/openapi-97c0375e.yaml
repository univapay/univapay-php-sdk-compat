  /subscriptions:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      tags: [Subscriptions]
      summary: Create Subscription
      description: Creates a new subscription.
      operationId: createSubscription
      x-operation-settings: *errorTemplates
      requestBody:
        description: Create Subscription request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionCreateRequest"
            examples:
              infiniteSubscription:
                summary: Infinite Subscription
                description: A standard recurring payment that continues indefinitely until explicitly canceled.
                value:
                  transaction_token_id: "11ef32a7-3a71-8662-803f-1bc27702eeec"
                  amount: 1000
                  currency: "JPY"
                  period: "monthly"

              finiteSubscription:
                summary: Finite Subscription (Processed by Univapay)
                description: A subscription that automatically completes after a specific number of billing cycles using `subscription_plan`.
                value:
                  transaction_token_id: "11ef32a7-3a71-8662-803f-1bc27702eeec"
                  amount: 1500
                  currency: "JPY"
                  period: "monthly"
                  subscription_plan:
                    plan_type: "fixed_cycles"
                    fixed_cycles: 12

              installmentPlan:
                summary: Credit Card Installments (Processed by the Card Company)
                description: Processes a total amount as a credit card installment plan (分割払い) using `installment_plan`. The `period` must be set to `monthly`.
                value:
                  transaction_token_id: "11ef32a7-3a71-8662-803f-1bc27702eeec"
                  amount: 12000
                  currency: "JPY"
                  period: "monthly"
                  installment_plan:
                    plan_type: "fixed_cycles"
                    fixed_cycles: 6
      responses:
        "201":
          description: Subscription Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
              examples:
                created:
                  $ref: "#/components/examples/SubscriptionCreateResponseExample"
    get:
      tags: [Subscriptions]
      summary: List Subscriptions (All Stores)
      description: Lists all subscriptions across all stores.
      operationId: listAllSubscriptions
      x-operation-settings: *errorTemplates
      parameters:
