        whenever a charge transitions to a new status (e.g., `pending` →
        `awaiting`), and as `charge_finished` when a charge reaches a terminal
        status (`successful`, `failed`, `error`). The `data` field contains
        the full Charge object at the time of the event.
      type: object
      required:
        - id
        - event
        - created_on
      properties:
        id:
          type: string
          format: uuid
          description: Unique ID of this webhook delivery.
          example: "11ef0000-0000-4000-8000-000000000001"
        event:
          type: string
          title: ChargeEvent
          enum: [charge_updated, charge_finished]
          example: charge_updated
          description: Event type discriminator — `charge_updated` or `charge_finished`.
        data:
          $ref: "#/components/schemas/Charge"
        created_on:
          type: string
          format: date-time
          description: Timestamp when the event was fired.
          example: "2026-04-09T07:35:50.000000Z"
      example:
        id: "11ef0000-0000-4000-8000-000000000001"
        event: charge_updated
        data:
          id: "6efb4e5c-690a-40f3-a4f1-0e19c5f84e98"
          store_id: "11edf541-c42d-653c-8c3d-dfe0a55f95c0"
          transaction_token_id: "11ef32a7-3a71-8662-803f-1bc27702eeec"
