        certificate_name: TARO YAMADA

    CustomsDeclarationPatchRequest:
      type: object
      required:
        - merchant_customs_no
      description: >-
        Request body for updating a customs declaration. Backend patch handling
        keeps the original `customs`, `certificate_id`, and `certificate_name`
        values and only accepts a new `merchant_customs_no`.
      properties:
        merchant_customs_no:
          type: string
          description: Updated merchant customs registration number.
          example: "1234567891"
      example:
        merchant_customs_no: "1234567891"

    WebhookTrigger:
      type: string
      description: Event type that triggers a webhook notification.
      example: charge_finished
      enum:
        - token_created
        - token_updated
        - token_three_d_s_updated
        - token_cvv_auth_updated
        - token_cvv_auth_check_updated
        - token_replaced
        - charge_updated
        - charge_finished
        - refund_finished
        - cancel_finished
        - customs_declaration_finished
        - recurring_token_deleted
        - bank_transfer_status_updated
        - subscription_created
        - subscription_payment
        - subscription_completed
        - subscription_failure
        - subscription_canceled
        - subscription_suspended

    Webhook:
      type: object
      description: >-
        Represents a webhook subscription. Webhooks send event notifications to
        a specified URL when triggered by payment events.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the webhook.
          example: "d3e4f5a6-b7c8-9012-def0-123456789abc"
        store_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the store this webhook belongs to (null for merchant-level webhooks).
          example: "76cf4a64-02bc-4cb3-9a28-74622e5928a1"
        merchant_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the merchant this webhook belongs to.
          example: "01234567-89ab-cdef-0123-456789abcdef"
        triggers:
          type: array
          description: List of event types that trigger this webhook.
          items:
            $ref: "#/components/schemas/WebhookTrigger"
          example:
            - charge_finished
            - refund_finished
        url:
          type: string
          format: uri
          description: The endpoint URL that receives webhook POST requests.
          example: "https://example.com/webhooks/payments"
        auth_token:
          type: string
          nullable: true
          description: >-
            Optional bearer token included in the `Authorization` header of
            webhook requests. Used to authenticate the webhook receiver.
          example: "my-secret-token"
        active:
          type: boolean
          description: Whether this webhook is currently active and receiving events.
          example: true
        is_integration:
          type: boolean
          description: >-
            Admin-only flag. Indicates this webhook is used for platform
            integration purposes. Not settable by merchants.
          example: false
        created_on:
          type: string
          format: date-time
          description: Timestamp when the webhook was created.
          example: "2026-04-01T00:00:00.000000Z"
        updated_on:
          type: string
          format: date-time
          description: Timestamp when the webhook was last updated.
          example: "2026-04-02T00:00:00.000000Z"

    WebhookList:
      type: object
      description: Paginated list of webhooks.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Webhook"
          description: List of resources.
          example:
            - id: d3e4f5a6-b7c8-9012-def0-123456789abc
              store_id: 76cf4a64-02bc-4cb3-9a28-74622e5928a1
              merchant_id: 01234567-89ab-cdef-0123-456789abcdef
              triggers:
                - charge_finished
                - refund_finished
              url: https://example.com/webhooks/payments
              auth_token: my-secret-token
              active: true
              is_integration: false
              created_on: "2026-04-01T00:00:00.000000Z"
              updated_on: "2026-04-02T00:00:00.000000Z"
            - id: e4f5a6b7-c8d9-0123-ef01-23456789abcd
              store_id: 76cf4a64-02bc-4cb3-9a28-74622e5928a1
              merchant_id: 01234567-89ab-cdef-0123-456789abcdef
              triggers:
                - subscription_payment
                - subscription_failure
              url: https://example.com/webhooks/subscriptions
              auth_token: null
              active: true
              is_integration: false
              created_on: "2026-04-03T08:30:00.000000Z"
              updated_on: "2026-04-03T08:30:00.000000Z"
        has_more:
          type: boolean
          description: Whether more results are available.
          example: false
    WebhookCreateRequest:
      type: object
      description: Request body to create a new store-level webhook subscription.
      required:
        - triggers
        - url
      properties:
        triggers:
          type: array
          description: >-
            List of event types that trigger this webhook. Must be non-empty
            and contain only events valid for the store level.
          items:
            $ref: "#/components/schemas/WebhookTrigger"
          example:
            - charge_finished
            - refund_finished
        url:
          type: string
          format: uri
          description: The URL to POST webhook payloads to.
          example: "https://example.com/webhooks/payments"
        auth_token:
          type: string
          nullable: true
          description: >-
            Optional bearer token sent in the `Authorization` header of webhook
            requests.
          example: "my-secret-token"
      example:
        triggers:
          - charge_finished
        url: "https://example.com/webhooks/payments"
        auth_token: "my-secret-token"

    WebhookUpdateRequest:
      type: object
      description: >-
        Request body for updating a webhook. All fields are optional. Omitted
        fields are left unchanged.
      properties:
        triggers:
          type: array
          description: Replace the trigger list. Must be non-empty if provided.
          items:
            $ref: "#/components/schemas/WebhookTrigger"
          example:
            - charge_finished
            - cancel_finished
        url:
          type: string
          format: uri
          description: Update the webhook endpoint URL.
          example: "https://example.com/webhooks/v2"
        auth_token:
          type: string
          nullable: true
          description: >-
            Update or clear the auth token. Send `null` to remove.
          example: "new-secret-token"
        active:
          type: boolean
          description: Enable or disable the webhook.
          example: true
      example:
        active: false

    WebhookEvent:
      type: object
      description: >-
        Represents a single delivery attempt of a webhook event, including the
        payload sent and the delivery outcome.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the webhook event.
          example: "e1f2a3b4-c5d6-7890-efab-123456789cde"
        webhook_id:
          type: string
          format: uuid
          description: ID of the parent webhook.
          example: "d3e4f5a6-b7c8-9012-def0-123456789abc"
        event:
          $ref: "#/components/schemas/WebhookTrigger"
        data:
          $ref: "#/components/schemas/WebhookCallbackData"
        successful:
          type: boolean
          description: Whether the webhook delivery was acknowledged (HTTP 2xx).
          example: true
        fired_on:
          type: string
          format: date-time
          description: Timestamp when the webhook was dispatched.
          example: "2026-04-09T07:36:00.000000Z"
        error_message:
          type: string
          nullable: true
          description: Error message if delivery failed.
          example:
        created_on:
          type: string
          format: date-time
          description: Timestamp when the event was created.
          example: "2026-04-09T07:35:50.000000Z"

      example: {}
    WebhookEventList:
      type: object
      description: Paginated list of webhook events.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEvent"
          description: List of resources.
          example:
            - id: e1f2a3b4-c5d6-7890-efab-123456789cde
