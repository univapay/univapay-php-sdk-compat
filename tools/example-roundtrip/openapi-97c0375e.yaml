# Apply authentication to all paths
security:
  - JWT_TOKEN: []
paths:
  # ========================================================================
  # MERCHANT / STORE CONTEXT PATHS
  # ========================================================================
  /me:
    get:
      tags:
        - Merchants
      summary: Get Current Merchant Context
      operationId: getCurrentMerchant
      # Anchor defined at first use so the spec needs no top-level x-shared holder,
      # which APIMatic reports as an unsupported extension. Every later operation
      # aliases this with `*errorTemplates`.
      # NOTE: keep each template short (<= ~46 chars). APIMatic's Ruby codegen
      # mis-wraps longer strings into invalid syntax. The error `reason` is not
      # inlined here on purpose — it stays available via the exception's errors[].
      x-operation-settings: &errorTemplates
        ErrorTemplates:
          "400": "HTTP 400 Bad Request: {$response.body#/code}"
          "401": "HTTP 401 Unauthorized: {$response.body#/code}"
          "403": "HTTP 403 Forbidden: {$response.body#/code}"
          "404": "HTTP 404 Not Found: {$response.body#/code}"
          "409": "HTTP 409 Conflict: {$response.body#/code}"
          "429": "HTTP 429 Rate Limited: {$response.body#/code}"
          "500": "HTTP 500 Server Error: {$response.body#/code}"
          "503": "HTTP 503 Unavailable: {$response.body#/code}"
          "504": "HTTP 504 Timeout: {$response.body#/code}"
          "0": "HTTP {$statusCode}: {$response.body#/code}"
      description: >-
        Returns merchant identity and the effective configuration resolved from
        bearer credentials. Treat this as the canonical introspection endpoint
        for merchant integrations.
      responses:
        "200":
          description: Current merchant context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
              examples:
                merchantExample:
                  $ref: "#/components/examples/MerchantResponseExample"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /checkout_info:
    get:
      tags:
        - Checkout
      summary: Get Checkout Info
      operationId: getCheckoutInfo
      x-operation-settings: *errorTemplates
      description: >-
        Returns the merchant's checkout configuration: enabled payment
        methods and their limits, installment/subscription plan settings,
        convenience-store and bank-transfer settings, widget theme, and
        per-brand feature support. Resolved entirely from the bearer
        credential — takes no parameters.
      responses:
        "200":
          description: Checkout configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutInfo"
              examples:
                checkoutInfoExample:
                  $ref: "#/components/examples/CheckoutInfoResponseExample"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /stores:
    get:
      tags:
        - Stores
      summary: List Stores
      operationId: listStores
      x-operation-settings: *errorTemplates
      description: >-
        Returns stores visible to the current merchant credential. Supports
        cursor pagination plus `short_id` and free-text `search` filters.
      parameters:
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/CursorDirectionQuery"
        - $ref: "#/components/parameters/ShortIdQuery"
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          description: Paginated store result set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreList"
              examples:
                listExample:
                  $ref: "#/components/examples/StoreListResponseExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /stores/{id}:
    get:
      tags:
        - Stores
      summary: Get Store
      operationId: getStore
      x-operation-settings: *errorTemplates
      description: >-
        Returns a single store plus its resolved configuration snapshot for the
        current merchant context.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Store resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
              examples:
                storeExample:
                  $ref: "#/components/examples/StoreResponseExample"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /stores/{storeId}/create_customer_id:
    post:
      tags:
        - Stores
      summary: Create Deterministic Customer ID
      operationId: createCustomerId
      x-operation-settings: *errorTemplates
      description: >-
        Derives a deterministic, store-scoped UUID from a local customer
        identifier supplied by the merchant. Calling this endpoint again with
        the same `customer_id` for the same store always returns the same
        UUID — the operation has no side effects (nothing is persisted), so
        it is safe to call repeatedly and does not require an
        `Idempotency-Key`. App Token Secret is required.
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
      requestBody:
        description: Request payload for deriving a customer ID.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerIdRequest"
            examples:
              createCustomerIdExample:
                $ref: "#/components/examples/CreateCustomerIdRequestExample"
      responses:
        "200":
          description: Customer ID derived successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCustomerIdResponse"
              examples:
                createCustomerIdResponse:
                  $ref: "#/components/examples/CreateCustomerIdResponseExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ========================================================================
  # CHARGES PATHS
  # ========================================================================
  /charges:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      tags:
        - Charges
      summary: Create Charge
      description: Creates a charge on a payment instrument (e.g. transaction token).
      operationId: createCharge
      x-operation-settings: *errorTemplates
      requestBody:
        description: Request payload for creating a charge.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChargeCreateRequest"
            examples:
              chargeExample:
                summary: Charge Request
                value:
                  transaction_token_id: "11ef32a7-3a71-8662-803f-1bc27702eeec"
                  amount: 1000
                  currency: "JPY"
                  metadata:
                    order_id: "12345"
                  redirect:
                    endpoint: "https://test.url/"
      responses:
        "201":
          description: Charge Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charge"
              examples:
                successResponse:
                  $ref: "#/components/examples/ChargeResponseExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    get:
      tags:
        - Charges
      summary: List Charges (All Stores)
      description: Lists all charges across all stores for the authenticated user.
      operationId: listAllCharges
      x-operation-settings: *errorTemplates
      parameters:
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/CursorDirectionQuery"
        - $ref: "#/components/parameters/CardLastFourQuery"
        - $ref: "#/components/parameters/CardNameQuery"
        - $ref: "#/components/parameters/CardExpMonthQuery"
        - $ref: "#/components/parameters/CardExpYearQuery"
        - $ref: "#/components/parameters/FromDateQuery"
        - $ref: "#/components/parameters/ToDateQuery"
        - $ref: "#/components/parameters/EmailQuery"
        - $ref: "#/components/parameters/PhoneQuery"
        - $ref: "#/components/parameters/AmountFromQuery"
        - $ref: "#/components/parameters/AmountToQuery"
        - $ref: "#/components/parameters/CurrencyQuery"
        - $ref: "#/components/parameters/ModeQuery"
        - $ref: "#/components/parameters/MetadataQuery"
        - $ref: "#/components/parameters/TransactionTokenIdQuery"
      responses:
        "200":
          description: List of Charges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargeList"
              examples:
                listExample:
                  $ref: "#/components/examples/ChargeListAllStoresResponseExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /stores/{storeId}/charges:
    get:
      tags:
        - Charges
      summary: List Charges (Specific Store)
      description: Lists all charges for a specific store.
      operationId: listStoreCharges
      x-operation-settings: *errorTemplates
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/CursorDirectionQuery"
        - $ref: "#/components/parameters/CardLastFourQuery"
        - $ref: "#/components/parameters/CardNameQuery"
        - $ref: "#/components/parameters/CardExpMonthQuery"
        - $ref: "#/components/parameters/CardExpYearQuery"
        - $ref: "#/components/parameters/FromDateQuery"
        - $ref: "#/components/parameters/ToDateQuery"
        - $ref: "#/components/parameters/EmailQuery"
        - $ref: "#/components/parameters/PhoneQuery"
        - $ref: "#/components/parameters/AmountFromQuery"
        - $ref: "#/components/parameters/AmountToQuery"
        - $ref: "#/components/parameters/CurrencyQuery"
        - $ref: "#/components/parameters/ModeQuery"
        - $ref: "#/components/parameters/MetadataQuery"
        - $ref: "#/components/parameters/TransactionTokenIdQuery"
      responses:
        "200":
          description: List of Charges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargeList"
              examples:
                listExample:
                  $ref: "#/components/examples/ChargeListResponseExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /stores/{storeId}/charges/{id}:
    get:
      tags:
        - Charges
      summary: Get Charge (Long Polling Supported)
      description: Retrieves the details of an existing charge.
      operationId: getCharge
      x-operation-settings: *errorTemplates
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdPath"
        - name: polling
          in: query
          schema:
            description: Whether to hold the request open until the status settles.
            type: boolean
          description: >-
            If set to true, instructs the API to internally poll the charge
            status  until it changes from 'pending' (the initial status) to
            another status.
          example: true
      responses:
        "200":
          description: Charge Details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charge"
              examples:
                successResponse:
                  $ref: "#/components/examples/ChargeGetSuccessExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    patch:
      tags:
        - Charges
      summary: Update Charge (Metadata)
      operationId: updateCharge
      x-operation-settings: *errorTemplates
      description: Use this request to add or modify arbitrary metadata on an existing charge.
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        description: Request payload for updating charge metadata.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChargeUpdateRequest"
            examples:
              updateExample:
                $ref: "#/components/examples/ChargePatchRequestExample"
      responses:
        "200":
          description: Updated Charge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charge"
              examples:
                successResponse:
                  $ref: "#/components/examples/ChargePatchResponseExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /stores/{storeId}/charges/{id}/capture:
    post:
      tags:
        - Charges
      summary: Capture Charge (Sales Confirmation)
      operationId: captureCharge
      x-operation-settings: *errorTemplates
      description: >-
        Captures a previously authorized charge (where `capture` was set to
        false during creation).  The capture amount must be less than or equal
        to the authorized amount, and the currency must match. The request
        body — and both of its fields — is optional: if omitted entirely, the
        full outstanding authorized amount (in the originally requested
        currency) is captured.
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        description: >-
          Optional request payload for capturing an authorized charge. Omit
          entirely to capture the full outstanding authorized amount.
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChargeCaptureRequest"
            examples:
              captureExample:
                $ref: "#/components/examples/ChargeCaptureRequestExample"
      responses:
        "200":
          description: Captured successfully. Returns an empty JSON object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyJsonObject"
              examples:
                captured:
                  $ref: "#/components/examples/CaptureChargeResponseExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /stores/{storeId}/charges/{id}/issuer_token:
    get:
      tags:
        - Charges
      summary: Get Issuer Token - Online and Bank Transfer
      operationId: getChargeIssuerToken
      x-operation-settings: *errorTemplates
      description: >-
        Retrieves the necessary payment execution URL (for online payments) or
        bank account details (for bank transfers).

        **⚠️ Prerequisite:** The charge `status` must be `awaiting` before
        requesting the issuer token.  If requested while the charge is in any
        other status, an error will be returned.
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Issuer token or bank transfer instructions retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuerToken"
              examples:
                onlineExample:
                  $ref: "#/components/examples/IssuerTokenOnlineExample"
                bankTransferExample:
                  $ref: "#/components/examples/IssuerTokenBankTransferExample"
                dBaraiExample:
                  $ref: "#/components/examples/IssuerTokenDBaraiExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /stores/{storeId}/charges/{id}/three_ds/issuer_token:
    get:
      tags:
        - Charges
      summary: Get 3-D Secure Issuer Token (Charge)
      operationId: getChargeThreeDsIssuerToken
      x-operation-settings: *errorTemplates
      description: >-
        Retrieves the 3-D Secure issuer token details required to authenticate a
        card charge.

        **⚠️ Prerequisites:** 1. The charge must be created with `three_ds.mode`
        set to `normal` or `force`. 2. You must poll the charge until its
        `status` becomes `awaiting` before making this request.

        **Execution Flow:** Once retrieved, the client (browser) must execute an
        `http_post` request to the `issuer_token` URL.  The `payload` object
        must be formatted according to the `content_type` (e.g., URL-encoded)
        and sent in the body. You can execute this via a redirect or inside an
        iframe. If using an iframe, continue polling the charge status  in the
        background until it reaches `successful`, `failed`, or `error`.
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: 3DS Redirect details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreeDsIssuerToken"
              examples:
                threeDsExample:
                  $ref: "#/components/examples/ThreeDsIssuerTokenExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /stores/{storeId}/charges/{id}/bank_transfer_ledgers:
    get:
      tags:
        - Charges
      summary: Get Bank Transfer Ledgers
      description: >-
        Retrieves bank transfer ledger entries associated with a charge. This
        is an optional reconciliation endpoint — not part of the required
        create-charge-and-poll flow.

        **⚠️ Requires a merchant-level application token**, unlike the rest of
        the bank transfer flow. A store application token (`Bearer
        {secret}.{jwt}` scoped to a `store_id`) is not sufficient here, even
        though the path is store-scoped.
      operationId: listBankTransferLedgers
      x-operation-settings: *errorTemplates
      parameters:
        - $ref: "#/components/parameters/StoreIdPath"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Ledger entries (deposits/payments)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankTransferLedgerList"
              examples:
                successResponse:
                  $ref: "#/components/examples/BankTransferLedgerListResponseExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ========================================================================
  # TOKENS PATHS
  # ========================================================================
  /tokens:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      tags:
        - Transaction Tokens
        - PCI DSS Required
      summary: Create Transaction Token
      operationId: createTransactionToken
      x-operation-settings: *errorTemplates
      description: >-
        Exchange raw payment data for a secure token. **PCI DSS Compliance
        Required** if sending raw card numbers.
      requestBody:
        description: Request payload for creating a transaction token.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionTokenCreateRequest"
            examples:
              cardExample:
                summary: Credit Card
                value:
                  payment_type: card
                  type: recurring
                  email: test@univapay.com
                  metadata:
                    univapay-phone-number: "+81 08012341234"
                  data:
                    cardholder: "TEST TEST"
                    card_number: "4242424242424242"
                    exp_month: "09"
                    exp_year: "26"
                    cvv: "123"
                    phone_number:
                      country_code: "81"
                      local_number: "08012341234"
                    three_ds:
