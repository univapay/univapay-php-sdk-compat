            jcb: 3.8
    CreateCustomerIdRequest:
      type: object
      required:
        - customer_id
      properties:
        customer_id:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The merchant's own local identifier for the customer, used as the
            seed for a deterministic per-store UUID.
          example: local-customer-1902
      example:
        customer_id: local-customer-1902
      description: Request payload for deriving a deterministic customer ID.
    CreateCustomerIdResponse:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
          description: >-
            Deterministic UUID derived from the store and the supplied local
            `customer_id`. Identical for repeated calls with the same inputs.
          example: 8a3f1b8e-2c1a-4b7a-9c2e-6f6b6f6e2b10
      example:
        customer_id: 8a3f1b8e-2c1a-4b7a-9c2e-6f6b6f6e2b10
      description: Response payload returned after deriving a deterministic customer ID.
    CustomsDeclarationWebhookDeclaration:
      type: object
      description: WeChat customs declaration payload returned by the backend formatter.
      properties:
        customs:
          type: string
          description: WeChat customs authority code.
          example: TOKYO
        merchant_customs_no:
          type: string
          description: Merchant customs registration number.
          example: "1234567890"
        certificate_id:
          type: string
          description: Customer certificate or passport identifier.
          example: AB1234567
        certificate_name:
          type: string
          description: Customer name as provided to customs.
          example: TARO YAMADA
      example:
        customs: TOKYO
        merchant_customs_no: "1234567890"
        certificate_id: AB1234567
        certificate_name: TARO YAMADA
    CustomsDeclarationWebhookResult:
      type: object
      nullable: true
      description: Result payload returned by the customs declaration formatter.
      properties:
        approving_authority:
          type: string
          nullable: true
          description: Customs authority that approved the declaration.
          example: TOKYO
        trade_id:
          type: string
          nullable: true
          description: Gateway trade identifier.
          example: wx_trade_12345
        transaction_id:
          type: string
          nullable: true
          description: Gateway transaction identifier for customs.
          example: wx_txn_12345
        charge_transaction_id:
          type: string
          nullable: true
          description: Gateway charge transaction identifier linked to the declaration.
          example: wx_charge_12345
      example:
        approving_authority: TOKYO
        trade_id: wx_trade_12345
        transaction_id: wx_txn_12345
        charge_transaction_id: wx_charge_12345
    CustomsDeclarationWebhookOtherError:
      type: object
      description: Nested customs-processing error entry returned in `others`.
      properties:
        type:
          type: string
          description: Backend other-error type.
          example: related_item
        credentials_id:
          type: string
          format: uuid
          nullable: true
          description: Gateway credentials involved in the error when applicable.
          example: "11ef0000-0000-4000-8000-000000000055"
        message:
          type: array
          nullable: true
          description: Additional reason values for `not_selected_reasons`.
          items:
            type: string
            description: Reason identifier returned by the backend.
            example: unsupported_brand
          example:
            - unsupported_brand
        item_name:
          type: string
          nullable: true
          description: Related item name for `related_item`.
          example: charge
      example:
        type: related_item
        item_name: charge
    CustomsDeclarationWebhookError:
      type: object
      nullable: true
      description: Error payload returned when customs declaration processing fails.
      properties:
        code:
          type: integer
          description: Backend customs declaration error code.
          example: 601
        message:
          type: string
          description: Human-readable backend error name.
          example: There was a processing error
        details:
          type: string
          nullable: true
          description: Optional backend-provided detail string.
          example: Missing customs registration
        others:
          type: array
          nullable: true
          description: Additional nested error records returned by the backend.
          items:
            $ref: "#/components/schemas/CustomsDeclarationWebhookOtherError"
          example:
            - type: related_item
              item_name: charge
      example:
        code: 601
        message: There was a processing error
        details: Missing customs registration
        others:
          - type: related_item
            item_name: charge
    CustomsDeclarationWebhookStatus:
      type: string
      description: Customs declaration status returned by the backend.
      enum:
        - pending
        - successful
        - failed
        - error
      example: successful
    CustomsDeclarationWebhookData:
      type: object
      description: >-
        Customs declaration payload delivered in `customs_declaration_finished`
        webhooks. Platform-level deliveries may include `platform_id` and `updated_on`.
      properties:
        id:
          type: string
          format: uuid
          description: Customs declaration identifier.
          example: "11ef0000-0000-4000-8000-000000000040"
        charge_id:
          type: string
          format: uuid
          description: Charge identifier associated with the declaration.
          example: "11ef0000-0000-4000-8000-000000000001"
        merchant_id:
          type: string
          format: uuid
          description: Merchant identifier.
          example: "11ef0000-0000-4000-8000-000000000020"
        store_id:
          type: string
          format: uuid
          description: Store identifier.
          example: "11ef0000-0000-4000-8000-000000000022"
        platform_id:
          type: string
          format: uuid
          nullable: true
          description: Platform identifier, included on platform-level deliveries.
          example: "11ef0000-0000-4000-8000-000000000099"
        mode:
          type: string
          description: Processing mode.
          example: test
        gateway:
          type: string
          description: Gateway that processed the declaration.
          example: wechat_online
        declaration:
          $ref: "#/components/schemas/CustomsDeclarationWebhookDeclaration"
        declaration_result:
          $ref: "#/components/schemas/CustomsDeclarationWebhookResult"
        status:
          $ref: "#/components/schemas/CustomsDeclarationWebhookStatus"
        error:
          $ref: "#/components/schemas/CustomsDeclarationWebhookError"
        created_on:
          type: string
          format: date-time
          description: Timestamp when the declaration was created.
          example: "2026-04-09T07:35:50.000000Z"
        updated_on:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the declaration was last updated, included on platform-level deliveries.
          example: "2026-04-10T07:35:50.000000Z"
      example:
        id: "11ef0000-0000-4000-8000-000000000040"
        charge_id: "11ef0000-0000-4000-8000-000000000001"
        merchant_id: "11ef0000-0000-4000-8000-000000000020"
        store_id: "11ef0000-0000-4000-8000-000000000022"
